:root{
  --paper:#FFF6EA;--paper2:#FFEEDB;--card:#FFFFFF;--ink:#1B1B1B;--ink2:#3A3A3A;--muted:#6E6E6E;--line:#E6D9C8;
  --or:#FE7F0C;--or2:#D45E00;--orsoft:#FFE4C8;--yel:#FFD400;
  --ok:#1E8E3E;--oksoft:#DDF5E3;--warn:#C96A00;--warnsoft:#FFE9CF;--bad:#D93025;--badsoft:#FDE0DD;
  --beam:#1FA2FF;--beam2:#8AF3FF;--blue:#1C6DD0;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --shadow:4px 4px 0 var(--ink);--shadow-sm:3px 3px 0 var(--ink);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.35;overscroll-behavior:none}
body{min-height:100vh;min-height:100dvh;background-image:radial-gradient(rgba(254,127,12,.10) 1.2px,transparent 1.2px);background-size:14px 14px}
body.locked{position:fixed;left:0;right:0;overflow:hidden}
h1,h2,h3{margin:0;font-weight:700}
.bang{font-family:'Bangers',Impact,'Arial Narrow Bold',sans-serif;letter-spacing:.04em;line-height:.92}
.cond{font-family:'BarlowC','Arial Narrow',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.title{font-family:'Bangers',Impact,sans-serif;letter-spacing:.04em;line-height:.9;color:var(--or);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke;text-shadow:3px 3px 0 var(--ink);transform:rotate(-3deg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:8px;padding:10px 12px;width:100%;outline:none}
input:focus,textarea:focus{box-shadow:3px 3px 0 var(--or)}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input.big{font-family:'Bangers',Impact,sans-serif;font-size:34px;letter-spacing:.04em;padding:6px 14px;text-align:center}
label{display:block;font-family:'BarlowC',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:13px;color:var(--ink2);margin:0 0 4px}
.field{margin-bottom:12px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.screen{padding:calc(10px + var(--sat)) 14px calc(88px + var(--sab));max-width:560px;margin:0 auto}
.screen.bar{padding-bottom:calc(150px + var(--sab))}
.screen.swipe{touch-action:pan-y}
@keyframes snap{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
/* header band */
.band{position:relative;margin:-10px -14px 14px;padding:calc(12px + var(--sat)) 18px 24px;min-height:calc(84px + var(--sat));background:var(--or);background-image:radial-gradient(rgba(0,0,0,.14) 1.5px,transparent 1.6px);background-size:10px 10px;color:#fff;clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),0 100%);border-bottom:3px solid var(--ink)}
.band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:var(--ink);clip-path:polygon(0 100%,100% 0,100% 100%)}
.band .h{font-family:'Bangers',Impact,sans-serif;font-size:34px;max-width:58%;letter-spacing:.04em;line-height:.95;color:#fff;-webkit-text-stroke:1.2px var(--ink);paint-order:stroke;text-shadow:3px 3px 0 var(--ink)}
.band .sub{font-family:'BarlowC',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--ink);margin-top:4px;max-width:62%}
.band .right{position:absolute;right:14px;top:calc(10px + var(--sat));text-align:right;white-space:nowrap}
.band .right .big{font-family:'Bangers',Impact,sans-serif;font-size:40px;line-height:.9;color:#fff;-webkit-text-stroke:1.2px var(--ink);paint-order:stroke;text-shadow:3px 3px 0 var(--ink)}
.band .right .big small{font-size:20px}
.band .right .sub{color:var(--ink);max-width:none}
.band.center{text-align:center}
.band.center .h{max-width:none;font-size:56px}
.band.center .h small{font-size:26px}
.band.center .sub{max-width:none;font-size:15px}
.band.cyc{padding-bottom:22px}
.cyc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.cyc-top .slot{width:96px;text-align:center;flex:none}
.cyc-top .slot .art{width:84px;height:84px;margin:0 auto;display:flex;align-items:center;justify-content:center;filter:drop-shadow(2px 2px 0 var(--ink))}
.cyc-top .slot .cap{font-family:'BarlowC',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:12px;color:var(--ink);margin-top:4px;white-space:nowrap}
.cyc-top .mid{flex:1;text-align:center;min-width:0}
.cyc-top .mid .c{font-family:'Bangers',Impact,sans-serif;font-size:40px;letter-spacing:.04em;line-height:.9;color:#fff;-webkit-text-stroke:1.2px var(--ink);paint-order:stroke;text-shadow:3px 3px 0 var(--ink)}
.cyc-top .mid .d{font-family:'Bangers',Impact,sans-serif;font-size:30px;letter-spacing:.04em;line-height:1;color:#fff;-webkit-text-stroke:1px var(--ink);paint-order:stroke;text-shadow:2px 2px 0 var(--ink);margin-top:4px}
.cyc-top .mid .dt{font-family:'BarlowC',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--ink);margin-top:6px}
.ring84{width:84px;height:84px}
.cstrip{display:flex;align-items:center;justify-content:center;gap:5px;margin:12px 0 0}
.cstrip .arrow{width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.35);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--ink)}
.cstrip .box{width:30px;height:30px;border-radius:7px;background:rgba(255,255,255,.35);border:2px solid rgba(27,27,27,.35);display:flex;align-items:center;justify-content:center;font-family:'BarlowC',sans-serif;font-weight:700;font-size:13px;color:rgba(27,27,27,.55);position:relative}
.cstrip .box.cur{background:#fff;border-color:var(--ink);color:var(--ink);box-shadow:2px 2px 0 var(--ink);transform:scale(1.08)}
.cstrip .box.done::after{content:"";position:absolute;right:-4px;top:-4px;width:11px;height:11px;border-radius:50%;background:var(--ok);border:1.5px solid var(--ink)}
.cstrip .box.miss::after{content:"";position:absolute;right:-4px;top:-4px;width:11px;height:11px;border-radius:50%;background:var(--badsoft);border:1.5px solid var(--ink)}
.cstrip .box.part::after{content:"";position:absolute;right:-4px;top:-4px;width:11px;height:11px;border-radius:50%;background:var(--yel);border:1.5px solid var(--ink)}
.cstrip .box.today{outline:2px solid var(--ink);outline-offset:1px}
.band.cyc .tags{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;margin-top:12px}
.band.cyc .tags .pill{box-shadow:2px 2px 0 var(--ink)}
.daytype{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;border-radius:999px;border:2px solid var(--ink);background:#fff;font-family:'BarlowC',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:15px;color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.daytype i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink)}
.band .pill{color:var(--ink)}
.bigball{display:flex;flex-direction:column;align-items:center;margin:18px 0 4px;position:relative}
.bigball .art{width:124px;height:124px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(3px 3px 0 var(--ink))}
.bigball .art.pop{animation:pop .6s ease-out}
.cycles{display:flex;flex-direction:column;gap:8px}
.cycrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:#fff;min-height:48px}
.cycrow.cur{border-color:var(--ink);box-shadow:var(--shadow-sm)}
.cycrow .n{font-family:'Bangers',Impact,sans-serif;font-size:22px;letter-spacing:.03em;width:72px;flex:none}
.cycrow .dates{font-size:12px;color:var(--muted);width:72px;flex:none}
.cycrow .balls{display:flex;gap:3px;flex:1;margin:0;justify-content:flex-start}
.cycrow .balls .mb{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ink);background:radial-gradient(circle at 40% 35%,#FFD27A,#FE7F0C 55%,#C24A00)}
.cycrow .balls .mb.off{background:#fff;border-style:dashed;border-color:#C9B9A5}
.cycrow .balls .mb.miss{background:#EDEDED;border-color:#BBB}
.cycrow .drg{width:26px;height:26px;flex:none;display:flex;align-items:center;justify-content:center}
/* sticky top bar on sub-screens */
.topbar{display:flex;align-items:center;gap:12px;margin:-10px -14px 14px;padding:calc(10px + var(--sat)) 14px 8px;min-height:44px;position:sticky;top:0;z-index:15;background:var(--paper);background-image:radial-gradient(rgba(254,127,12,.10) 1.2px,transparent 1.2px);background-size:14px 14px;border-bottom:2px solid var(--line)}
.topbar .back{width:44px;height:44px;border-radius:10px;background:#fff;border:2px solid var(--ink);box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex:none}
.topbar .back:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.topbar .t{font-family:'Bangers',Impact,sans-serif;font-size:28px;letter-spacing:.04em;line-height:1}
.topbar .s{font-size:13px;color:var(--muted)}
.topbar .r{margin-left:auto;text-align:right}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--or);color:var(--ink);font-family:'BarlowC',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:18px;border:2.5px solid var(--ink);border-radius:10px;padding:12px 18px;min-height:50px;width:100%;box-shadow:var(--shadow);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.sec{background:#fff}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--muted);color:var(--muted)}
.btn.sm{width:auto;min-height:42px;padding:6px 14px;font-size:15px;box-shadow:var(--shadow-sm)}
.btn.run{background:var(--beam);color:#fff}
.link{font-family:'BarlowC',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:13px;color:var(--or2);padding:8px 2px;min-height:40px;display:inline-flex;align-items:center}
/* cards */
.card{background:var(--card);border:2.5px solid var(--ink);border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;border-width:2px}
.card h3{font-family:'Bangers',Impact,sans-serif;font-size:24px;letter-spacing:.04em;font-weight:400;margin-bottom:6px}
.card .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sec-h{font-family:'Bangers',Impact,sans-serif;font-size:28px;letter-spacing:.04em;margin:18px 0 10px;display:flex;align-items:center;gap:10px}
.sec-h::after{content:"";flex:1;height:3px;background:var(--ink);transform:skewX(-30deg)}
.muted{color:var(--muted);font-size:13px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.or{color:var(--or2)}
.small{font-size:13px}.big{font-size:22px;font-weight:800}
.center{text-align:center}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:#fff;border-top:3px solid var(--ink);padding:6px 0 calc(6px + var(--sab));z-index:20}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:'BarlowC',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:12px;color:var(--muted);padding:4px 0;min-height:52px;position:relative}
.nav button.on{color:var(--or2)}
.nav button.on::before{content:"";position:absolute;top:-9px;left:30%;right:30%;height:4px;background:var(--or);border-radius:0 0 4px 4px}
.nav svg{width:26px;height:26px}
/* speech bubble line */
.funline{font-family:'BarlowC',sans-serif;font-weight:600;font-size:16px;margin:0 0 12px;padding:9px 14px;background:#fff;border:2px solid var(--ink);border-radius:12px;position:relative;box-shadow:var(--shadow-sm)}
.funline::before{content:"";position:absolute;left:22px;bottom:-10px;border:8px solid transparent;border-top-color:var(--ink);border-bottom:0}
.funline::after{content:"";position:absolute;left:24px;bottom:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
.pill{display:inline-flex;align-items:center;gap:4px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:5px 12px;font-family:'BarlowC',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:13px;min-height:36px}
.pill.or{background:var(--or);color:var(--ink)}
.daynav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
/* checklist */
.todo{list-style:none;margin:0;padding:0}
.todo li{position:relative;display:flex;align-items:center;gap:12px;background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:10px;margin-bottom:10px;min-height:64px;overflow:hidden;box-shadow:var(--shadow-sm)}
.todo .chk{width:38px;height:38px;border-radius:8px;border:2.5px solid var(--ink);flex:none;display:flex;align-items:center;justify-content:center;background:#fff;transition:background .15s}
.todo .chk svg{width:22px;height:22px;opacity:0;transform:scale(.4);transition:all .2s}
.todo li.done{background:var(--paper2)}
.todo li.done .chk{background:var(--or)}
.todo li.done .chk svg{opacity:1;transform:none}
.todo li.future .chk{border-style:dashed;border-color:#B9A990;background:transparent}
.todo .lab{flex:1;min-width:0;padding:2px 0}
.todo .lab .t{font-family:'BarlowC',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:19px;position:relative;display:inline-block;transition:opacity .25s;line-height:1.1}
.todo .lab .t::after{content:"";position:absolute;left:-2px;right:-2px;top:52%;height:4px;background:var(--beam);border-radius:2px;transform:scaleX(0);transform-origin:left;transition:transform .35s ease-out .25s;box-shadow:0 0 6px var(--beam)}
.todo li.done .lab .t{opacity:.45}
.todo li.done .lab .t::after{transform:scaleX(1)}
.todo .lab .s{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo .go{color:var(--ink);font-size:22px;padding:0 6px;font-weight:700}
.wtag{display:inline-block;font-family:'BarlowC',sans-serif;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:5px;color:#fff;vertical-align:middle;margin-left:6px;line-height:16px}
.wtag.push{background:#E05A00}.wtag.pull{background:#1C6DD0}.wtag.legs{background:#1E8E3E}.wtag.mt{background:#C2185B}.wtag.rest{background:#8A8A8A}
.zap{position:absolute;left:52px;top:50%;height:40px;width:70px;transform:translate(-20px,-50%);pointer-events:none;opacity:0}
.zap.play{animation:zap .75s ease-out forwards}
@keyframes zap{0%{opacity:0;transform:translate(-24px,-50%) scale(.6)}15%{opacity:1;transform:translate(0,-50%) scale(1)}70%{opacity:1;transform:translate(6px,-50%) scale(1)}100%{opacity:0;transform:translate(12px,-50%) scale(1)}}
.burst{position:absolute;right:60px;top:50%;width:46px;height:46px;transform:translateY(-50%) scale(0);pointer-events:none}
.burst.play{animation:burst .6s ease-out forwards}
@keyframes burst{0%{transform:translateY(-50%) scale(0);opacity:1}60%{transform:translateY(-50%) scale(1.2);opacity:1}100%{transform:translateY(-50%) scale(1.4);opacity:0}}
/* dragon balls */
.balls{display:flex;justify-content:center;gap:8px;margin:16px 0 6px}
.ball{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8 0,#fff0 40%),radial-gradient(circle at 50% 50%,#FFB347,#FE7F0C 60%,#C25400);border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);position:relative;transition:all .3s}
.ball.off{background:#fff;box-shadow:none;border-style:dashed;border-color:#C9B9A5}
.ball::after{content:"";position:absolute;left:10px;top:8px;width:9px;height:9px;background:#fff;border-radius:50%;opacity:.6}
.ball.off::after{display:none}
.ball.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.streak{display:inline-flex;align-items:center;gap:6px;margin:6px auto 0;background:var(--yel);border:2px solid var(--ink);border-radius:999px;padding:3px 12px;font-family:'BarlowC',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:13px}
/* beam bar */
.beam{background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:10px 12px 8px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.beam .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.beam .hd .n{font-family:'BarlowC',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:18px}
.beam .hd .g{font-size:13px;color:var(--muted)}
.beam svg{width:100%;height:auto;display:block}
.beam .st{font-size:14px;margin-top:2px;font-weight:700}
.tabs{display:flex;gap:6px;margin:8px 0 12px}
.tabs button{flex:1;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:9px 0;font-family:'BarlowC',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:15px;color:var(--ink);min-height:44px}
.tabs button.on{background:var(--or);box-shadow:var(--shadow-sm)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
/* modal */
.modalbg{position:fixed;inset:0;background:rgba(27,27,27,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;animation:snap .15s}
.modal{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:18px;width:100%;max-width:440px;max-height:85vh;overflow:auto;box-shadow:6px 6px 0 var(--ink)}
.modal h3{font-family:'Bangers',Impact,sans-serif;font-size:28px;letter-spacing:.04em;font-weight:400;margin-bottom:8px}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:14px;margin:8px 0}
.kv b{font-weight:800}
.dots{display:flex;gap:4px;align-items:flex-end;height:30px;margin:6px 0}
.dots i{flex:1;background:var(--beam);border:1.5px solid var(--ink);border-bottom:0;border-radius:3px 3px 0 0;min-height:4px}
/* workout */
.ex{background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.ex.on{border-color:var(--ok)}
.ex .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ex .nm{font-family:'BarlowC',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:19px;line-height:1.1}
.ex .sch{font-size:13px;color:var(--or2);font-weight:700}
.ex .last{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);margin:8px 0;background:var(--paper2);border-radius:8px;padding:6px 8px;border:1.5px dashed #D9B68E;min-height:40px}
.ex .last b{font-weight:700}
.ex .last .use{margin-left:auto;flex:none;font-family:'BarlowC',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:12px;background:#fff;border:2px solid var(--ink);border-radius:6px;padding:4px 8px;min-height:30px}
.ex .q{font-size:13px;color:var(--muted);font-style:italic;margin:-2px 0 8px}
.sets{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:center}
.sets span{font-size:13px;color:var(--muted);width:26px;font-weight:700}
.sets input{padding:8px 10px;text-align:center}
.ex textarea{margin-top:8px;min-height:40px;resize:vertical}
.ex .verdict{font-size:14px;margin-top:8px;font-weight:700}
.exchk{width:38px;height:38px;border-radius:8px;border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;background:#fff;flex:none}
.exchk.on{background:var(--or)}
.exchk svg{width:22px;height:22px}
.botbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:3px solid var(--ink);padding:10px 14px calc(10px + var(--sab));display:flex;gap:10px;align-items:center}
.botbar .btn{flex:1}
.botbar .rest{flex:none;width:118px;background:#fff;font-size:16px}
.botbar .rest.run{background:var(--beam);color:#fff;border-color:var(--ink)}
.botbar .dur{flex:none;width:auto;min-height:50px;padding:0 10px;background:var(--paper2);font-size:14px}
/* stretch */
.step{background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.step.cur{border-color:var(--or);box-shadow:4px 4px 0 var(--or)}
.step.did{opacity:.55}
.step img{width:100%;border-radius:8px;display:block;margin-top:8px;border:2px solid var(--ink)}
.step .tm{display:flex;align-items:center;gap:10px;margin-top:10px}
.step .tm .t{font-family:'Bangers',Impact,sans-serif;font-size:30px;color:var(--or2);min-width:70px;letter-spacing:.04em}
.player{position:sticky;top:calc(66px + var(--sat));z-index:14;background:var(--or);border:2.5px solid var(--ink);border-radius:12px;padding:10px 14px;margin-bottom:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.player .big{font-family:'Bangers',Impact,sans-serif;font-size:46px;line-height:1;letter-spacing:.04em;color:#fff;-webkit-text-stroke:1.2px var(--ink);paint-order:stroke;text-shadow:3px 3px 0 var(--ink);min-width:80px;text-align:center}
.player .info{flex:1;min-width:0}
.player .info .n{font-family:'BarlowC',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:15px;line-height:1.15}
.player .info .sd{font-size:13px;color:var(--ink2)}
.player .btn.sm{min-height:40px;padding:4px 10px}
/* avatar */
.avatar{display:flex;gap:10px;align-items:center;margin-bottom:14px;background:#fff;border:2.5px solid var(--ink);border-radius:12px;box-shadow:var(--shadow);padding:10px 14px;position:relative;overflow:hidden}
.avatar::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 50%,var(--orsoft) 0,transparent 55%)}
.avatar>*{position:relative}
.avatar svg{width:124px;height:186px;flex:none;overflow:visible}
.score{font-family:'Bangers',Impact,sans-serif;font-size:56px;color:var(--or);-webkit-text-stroke:1.2px var(--ink);paint-order:stroke;text-shadow:3px 3px 0 var(--ink);line-height:1;letter-spacing:.03em}
.lvl{font-family:'BarlowC',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:18px}
/* calendar */
.cal{touch-action:pan-y;background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:12px;box-shadow:var(--shadow);margin-bottom:14px}
.cal .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal .mh .m{font-family:'Bangers',Impact,sans-serif;font-size:30px;letter-spacing:.04em}
.cal .mh button{width:44px;height:44px;border:2px solid var(--ink);border-radius:8px;background:#fff;font-size:20px;font-weight:700;box-shadow:2px 2px 0 var(--ink)}
.cal .mh button:disabled{opacity:.3;box-shadow:none}
.ring{display:flex;align-items:center;gap:14px;margin:4px 0 12px}
.ring svg{width:84px;height:84px;flex:none}
.wd{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.wd span{text-align:center;font-family:'BarlowC',sans-serif;font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{aspect-ratio:1/1.1;border:2px solid var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:700;font-size:14px;background:#fff;position:relative;min-height:44px}
.cell.out{opacity:.25;border-style:dashed}
.cell.in{border-color:var(--ink)}
.cell.today{box-shadow:0 0 0 3px var(--or)}
.cell.sel{background:var(--or)}
.cell .w{font-family:'BarlowC',sans-serif;font-size:10px;letter-spacing:.04em;text-transform:uppercase;padding:0 4px;border-radius:4px;color:#fff;line-height:14px}
.cell .w.push{background:#E05A00}.cell .w.pull{background:#1C6DD0}.cell .w.legs{background:#1E8E3E}.cell .w.mt{background:#C2185B}.cell .w.rest{background:#8A8A8A}
.cell .m{position:absolute;right:2px;top:2px;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink);font-size:9px;display:flex;align-items:center;justify-content:center;background:#fff;line-height:1}
.cell .m.done{background:var(--ok);color:#fff}.cell .m.part{background:var(--yel)}.cell .m.miss{background:var(--badsoft);color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink);vertical-align:-1px;margin-right:3px}
.daycard{padding:12px 14px}
.daycard .hd{margin-bottom:2px}
.daycard .hd .bang{font-size:24px;min-width:0}
.daycard .sep{font-family:'BarlowC',sans-serif;font-weight:400;color:var(--muted);margin:0 3px;font-size:20px;vertical-align:1px}
.daycard .right{display:flex;align-items:center;gap:8px;flex:none}
.daycard .go{font-size:26px;line-height:1;color:var(--muted)}
.daycard .dl li{padding:8px 4px;min-height:42px}
.dl{list-style:none;margin:0;padding:0}
.dl li{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1.5px solid var(--line);min-height:48px}
.dl li:last-child{border-bottom:0}
.dl .n{font-family:'Bangers',Impact,sans-serif;font-size:22px;width:44px;color:var(--or2);letter-spacing:.03em}
.dl .w{flex:1;font-family:'BarlowC',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:16px}
.dl .w small{display:block;font-family:system-ui;font-weight:400;text-transform:none;letter-spacing:0;font-size:12px;color:var(--muted)}
.dl .st{font-size:18px;width:28px;text-align:center}
.dl li.today{background:var(--orsoft);border-radius:8px}
/* setup wizard */
.steps{display:flex;gap:6px;justify-content:center;margin:0 0 14px}
.steps i{width:34px;height:6px;border-radius:3px;background:#E6D9C8;border:1.5px solid var(--ink)}
.steps i.on{background:var(--or)}
details.adv{margin-top:6px}
details.adv summary{list-style:none;cursor:pointer;font-family:'BarlowC',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:13px;color:var(--or2);padding:8px 0;min-height:40px;display:flex;align-items:center;gap:6px}
details.adv summary::-webkit-details-marker{display:none}
details.adv summary::before{content:"▸";transition:transform .15s}
details.adv[open] summary::before{transform:rotate(90deg)}
/* intro */
.intro{position:fixed;inset:0;background:var(--or);background-image:radial-gradient(rgba(0,0,0,.12) 1.5px,transparent 1.6px),repeating-conic-gradient(from 0deg at 50% 62%,rgba(255,255,255,.18) 0 6deg,transparent 6deg 14deg);background-size:10px 10px,100% 100%;display:flex;flex-direction:column;align-items:center;z-index:100;padding-top:calc(40px + var(--sat))}
.intro .ttl{display:flex;flex-direction:column;align-items:center;gap:6px}
.intro .t1{font-size:84px;color:#fff}
.intro .t2{font-size:56px;color:#fff;transform:rotate(-3deg) translateY(-4px)}
.intro .t1,.intro .t2{animation:slam .5s cubic-bezier(.2,1.4,.4,1) both}
.intro .t2{animation-delay:.25s}
@keyframes slam{from{opacity:0;transform:scale(2.4) rotate(-8deg)}to{opacity:1;transform:scale(1) rotate(-3deg)}}
.intro .stage{flex:1;width:100%;max-width:520px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:60px;position:relative}
.intro .stage svg{height:min(60vh,520px);width:auto}
.intro .soft{transform-origin:120px 170px;transform-box:view-box;animation:softout 1.5s ease-in-out .1s forwards}
@keyframes softout{0%{transform:scaleX(1);opacity:1}55%{opacity:1}100%{transform:scaleX(.835);opacity:0}}
.intro .softhead{animation:softhead 1.5s steps(1,end) .1s forwards}
@keyframes softhead{0%{opacity:1}60%{opacity:0}100%{opacity:0}}
.intro .kick .bag{transform-origin:300px 10px;transform-box:view-box;animation:ibag .9s ease-out .22s forwards}
@keyframes ibag{0%{transform:rotate(0)}35%{transform:rotate(22deg)}70%{transform:rotate(-8deg)}100%{transform:rotate(4deg)}}
.intro .imp{opacity:0;transform-origin:272px 130px;transform-box:view-box;animation:iimp .35s ease-out .2s forwards}
@keyframes iimp{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
.intro .wt{position:absolute;left:24px;bottom:90px;font-family:'Bangers',Impact,sans-serif;font-size:40px;color:#fff;-webkit-text-stroke:1.2px var(--ink);paint-order:stroke;text-shadow:3px 3px 0 var(--ink)}
.intro .skip{position:absolute;bottom:calc(20px + var(--sab));left:50%;transform:translateX(-50%);font-family:'BarlowC',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink);font-size:14px;padding:12px 24px;background:#fff;border:2px solid var(--ink);border-radius:999px;box-shadow:var(--shadow-sm)}
.toast{position:fixed;left:14px;right:14px;bottom:calc(100px + var(--sab));margin:0 auto;width:max-content;max-width:calc(100vw - 28px);background:var(--ink);color:#fff;font-family:'BarlowC',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:10px 18px;border-radius:999px;z-index:60;text-align:center;border:2px solid #fff;box-shadow:3px 3px 0 var(--or);animation:toastin .22s ease-out;transition:opacity .18s ease-in,transform .18s ease-in;will-change:opacity,transform}
.toast.out{opacity:0;transform:translateY(8px)}
@keyframes toastin{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
.dragon{position:fixed;inset:0;z-index:80;background:rgba(255,246,234,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;animation:snap .3s}
.dragon svg{width:min(92vw,440px);height:auto}
.dragon .msg{font-family:'Bangers',Impact,sans-serif;font-size:44px;color:var(--or);-webkit-text-stroke:1.2px var(--ink);paint-order:stroke;text-shadow:3px 3px 0 var(--ink);letter-spacing:.04em;margin-top:6px}
hr{border:0;border-top:2px solid var(--line);margin:14px 0}
.warnbox{background:var(--warnsoft);border:2px solid var(--ink);border-radius:10px;padding:8px 12px;font-size:14px;color:var(--ink);margin-bottom:12px;font-weight:600;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:8px;min-height:44px}
.chip{display:inline-block;padding:3px 9px;border-radius:6px;border:1.5px solid var(--ink);font-family:'BarlowC',sans-serif;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;background:#fff}
.chip.ok{background:var(--oksoft);color:var(--ok)}.chip.warn{background:var(--warnsoft);color:var(--warn)}.chip.bad{background:var(--badsoft);color:var(--bad)}.chip.muted{background:#f2f2f2;color:var(--muted)}
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .v{font-family:'Bangers',Impact,sans-serif;font-size:30px;letter-spacing:.04em;line-height:1}
.kpi .l{font-size:13px;color:var(--muted)}
.target{display:flex;justify-content:space-around;text-align:center;background:var(--paper2);border:2px dashed #D9B68E;border-radius:10px;padding:10px;margin-bottom:12px}
.target .v{font-family:'Bangers',Impact,sans-serif;font-size:30px;letter-spacing:.04em;line-height:1;color:var(--or2)}
.target .l{font-family:'BarlowC',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:12px;color:var(--ink2)}
</style>

  const rs = $('[data-ghrestore]'); if (rs) rs.onclick = async () => { if (!confirm('Replace everything on this phone with the copy on GitHub?')) return; try { await ghRestore(); toast('Restored from GitHub'); render(); } catch (e) { toast('Restore failed: ' + (e.message || e), 3000); } };
  const ur = $('[data-ghuseremote]'); if (ur) ur.onclick = async () => { try { await ghRestore(); toast('Using GitHub\'s copy'); render(); } catch (e) { toast('Failed: ' + (e.message || e), 3000); } };
  const ul = $('[data-ghuselocal]'); if (ul) ul.onclick = async () => { GH.conflict = null; ghSave(); const r = await syncNow({ force: true, quiet: true }); toast(r === 'ok' ? 'Phone\'s copy saved to GitHub' : (GH.lastError || 'Failed'), 2600); render(); };
  const dc = $('[data-ghdisconnect]'); if (dc) dc.onclick = () => { if (confirm('Disconnect cloud backup? Data on GitHub stays there.')) { ghDisconnect(); render(); } };
}
function bindProfile() {
  bindCloud();
  const mf = $('#mfpFile'); app.querySelector('[data-mfp]').onclick = () => mf.click();
  mf.onchange = async () => {
    const f = mf.files && mf.files[0]; mf.value = ''; if (!f) return;
    try {
      const days = await readMfpFile(f), n = Object.keys(days).length; if (!n) return toast('No days found in that file', 3000);
      const r = applyMfpDays(days);
      const lines = [];
      if (r.filled) lines.push(`<b>${r.filled}</b> day${r.filled > 1 ? 's' : ''} filled`); if (r.updated) lines.push(`<b>${r.updated}</b> refreshed`); if (r.kept) lines.push(`<b>${r.kept}</b> kept (logged by hand)`);
      if (!r.filled && !r.updated) lines.push('Nothing new for the project days');
      modal(`<h3>MFP import</h3><div class="muted">${n} days in the file${r.first ? ' · filled ' + fmtShort(r.first) + ' – ' + fmtShort(r.last) : ''}</div><div style="margin:10px 0;line-height:1.6">${lines.join('<br>')}${r.skippedToday ? '<br><span class="muted">Today was skipped — the export is usually taken before the day is complete; share tonight\'s screenshot instead.</span>' : ''}</div><button class="btn" data-close>OK</button>`);
    } catch (e) { toast('Import failed: ' + (e.message || e), 3500); }
  };
  const ep = $('[data-editp]'); if (ep) ep.onclick = () => { R.editProject = true; render(); };
  const cp = $('[data-cancelp]'); if (cp) cp.onclick = () => { R.editProject = false; render(); };
  if (R.editProject) {
    const upd = () => { const o = readForm(app); const Dd = diffDays(o.startDate, o.endDate); $('#derived').innerHTML = Dd > 0 && o.weight ? `${Dd} days → goal <b class="or">${(o.weight - o.deficit * Dd / 7700).toFixed(1)} kg</b>` : ''; };
    app.querySelectorAll('input').forEach(i => i.oninput = upd); upd();
    $('[data-savep]').onclick = () => { const o = readForm(app); if (!o.weight || diffDays(o.startDate, o.endDate) < 7) return toast('Check dates and weight'); Object.assign(S.project, { name: o.name, startDate: o.startDate, endDate: o.endDate, deficit: o.deficit, bmr: o.bmr, protein: o.protein, bandDefault: o.bandDefault, waterDrop: o.waterDrop, height: o.height, age: o.age, start: { weight: o.weight, fat: o.fat, muscle: o.muscle, skeletal: o.skeletal, visceral: o.visceral, water: o.water } }); save(); R.editProject = false; render(); toast('Saved'); };
  }
  $('[data-backup]').onclick = () => { S.meta.lastBackup = new Date().toISOString(); save(); download('vikac-backup-' + today() + '.json', JSON.stringify(S, null, 1)); toast('Backup downloaded'); render(); };
  $('[data-restore]').onclick = () => $('#restoreFile').click();
  $('#restoreFile').onchange = e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { const o = JSON.parse(rd.result); if (!o.project || !o.days) throw 0; if (confirm('Replace all current data with this backup?')) { S = o; save(); toast('Restored'); render(); } } catch (err) { toast('Not a valid backup file'); } }; rd.readAsText(f); };
  $('[data-csv]').onclick = () => { const rows = [['date', 'weight', 'fat', 'muscle', 'skeletal', 'visceral', 'water', 'kcal', 'protein', 'band', 'balance', 'balls']]; const dates = new Set([...Object.keys(S.readings), ...Object.keys(S.days)]); [...dates].sort().forEach(d => { const r = S.readings[d] || {}, n = (S.days[d] || {}).nutrition || {}, nc = nutritionCalc(d); rows.push([d, r.weight, r.fat, r.muscle, r.skeletal, r.visceral, r.water, n.kcal, n.protein, n.band, nc ? nc.balance : '', tOf(d) >= 0 ? dragonBalls(d).balls : ''].map(x => x == null ? '' : x)); }); download('vikac-readings-' + today() + '.csv', rows.map(r => r.join(',')).join('\n'), 'text/csv'); };
  $('[data-intro]').onclick = () => playIntro(() => render());
  $('[data-update]').onclick = async () => { toast('Checking…'); try { const reg = await navigator.serviceWorker.getRegistration(); if (reg) { await reg.update(); if (reg.waiting) reg.waiting.postMessage('skipWaiting'); } const r = await fetch('index.html', { cache: 'no-cache' }); const t = await r.text(); const m = t.match(/APP_VERSION = '([^']+)'/); if (m && m[1] !== APP_VERSION) { toast('Version ' + m[1] + ' found — reloading'); setTimeout(() => location.reload(), 800); } else toast('You have the latest version (' + APP_VERSION + ')'); } catch (e) { toast('Offline — try again later'); } };
  $('[data-reset]').onclick = () => { if (confirm('Delete ALL data? Back up first!') && confirm('Really? This cannot be undone.')) { S = { project: null, days: {}, readings: {}, sessions: [], targets: {}, meta: { schema: 1, lastBackup: null, introSeen: true } }; save(); R.stack = []; render(); } };
}

/* ---------- Intro: slim-down → power-up → high kick (three static scenes, CSS/SMIL animated) ---------- */
function titleHtml(name, ghost) { const t = titleLines(name); const sz = Math.min(66, t.size); return `<div class="title" style="font-size:${sz}px;${ghost ? 'opacity:.45' : ''}">${esc(t.l1)}</div>${t.l2 ? `<div class="title" style="font-size:${Math.round(sz * .72)}px;margin-top:6px;${ghost ? 'opacity:.45' : ''}">${esc(t.l2)}</div>` : ''}`; }
function titleLines(name) {
  name = (name || '').trim() || 'Vikač High Kikač';
  const words = name.split(/\s+/); let l1 = words[0], l2 = words.slice(1).join(' ');
  if (words.length >= 4) { const h = Math.ceil(words.length / 2); l1 = words.slice(0, h).join(' '); l2 = words.slice(h).join(' '); }
  const longest = Math.max(l1.length, l2.length), size = Math.max(26, Math.min(84, Math.round(84 * 6 / Math.max(6, longest))));
  return { l1, l2, size };
}
function playIntro(done) {
  const el = document.createElement('div'); el.className = 'intro';
  const tl = titleLines(S.project ? S.project.name : '');
  el.innerHTML = `<div class="ttl"><div class="title t1" style="font-size:${tl.size}px">${esc(tl.l1)}</div>${tl.l2 ? `<div class="title t2" style="font-size:${Math.round(tl.size * .68)}px">${esc(tl.l2)}</div>` : ''}</div><div class="stage"><div id="istage"></div><div class="wt" id="iwt">90 kg</div></div><button class="skip">skip</button>`;
  document.body.appendChild(el); let fin = false; const tms = [];
  const stage = el.querySelector('#istage'), wt = el.querySelector('#iwt');
  const bag = `<g class="bag"><line x1="300" y1="10" x2="300" y2="40" stroke="#1B1B1B" stroke-width="4"/><rect x="272" y="40" width="56" height="170" rx="18" fill="#2A2A2A" stroke="#1B1B1B" stroke-width="3"/><rect x="272" y="54" width="56" height="14" fill="#FE7F0C"/><rect x="272" y="180" width="56" height="14" fill="#FE7F0C"/><path d="M280 80 L280 170" stroke="#444" stroke-width="3" stroke-linecap="round"/></g>`;
  const impact = `<g class="imp" transform="translate(272 130)"><path d="M0 -40 L10 -12 L40 -26 L18 0 L44 18 L14 12 L8 44 L-6 14 L-38 24 L-14 0 L-40 -22 L-12 -10 Z" fill="#FFD400" stroke="#1B1B1B" stroke-width="3" stroke-linejoin="round"/><text x="0" y="8" text-anchor="middle" font-family="Bangers,Impact" font-size="26" fill="#1B1B1B">KIKAČ!</text></g>`;
  const wrap = (inner, dx) => `<svg viewBox="-20 -40 360 400" class="${dx === 30 ? 'kick' : ''}" style="overflow:visible">${bag}<g transform="translate(${dx} 0)">${inner}</g>${dx === 30 ? impact : ''}</svg>`;
  // scene 1: lean body underneath, soft body on top that scales down and fades (the morph)
  const lean = heroSvg({ parts: true, slim: 1, level: 3, mood: 'cool' }), soft = heroSvg({ parts: true, slim: 0, level: 0, mood: 'tired' });
  stage.innerHTML = wrap(`${lean.defs}${soft.defs}${lean.legs}${lean.shorts}${lean.torso}${lean.head}<g class="soft">${soft.torso}</g><g class="softhead">${soft.head}</g>${lean.armsL}${lean.armsR}`, 40);
  const t0 = performance.now();
  tms.push(setInterval(() => { const t = (performance.now() - t0) / 1000; wt.textContent = Math.round(90 - 13 * Math.min(1, Math.max(0, (t - 0.1) / 1.5))) + ' kg'; }, 80));
  tms.push(setTimeout(() => { if (!fin) stage.innerHTML = wrap(heroSvg({ inner: true, slim: 1, level: 4, mood: 'fire', aura: true }), 40); }, 1700));
  tms.push(setTimeout(() => { if (!fin) stage.innerHTML = wrap(heroSvg({ inner: true, slim: 1, level: 4, mood: 'fire', aura: true, pose: 'kick' }), 30); }, 2300));
  const end = () => { if (fin) return; fin = true; tms.forEach(clearTimeout); tms.forEach(clearInterval); el.style.transition = 'opacity .4s'; el.style.opacity = 0; setTimeout(() => el.remove(), 400); done && done(); };
  el.querySelector('.skip').onclick = end; tms.push(setTimeout(end, 4000));
}

/* ---------- Phone back button: always stays inside the app ---------- */
function armBack() { try { history.pushState({ vikac: 1 }, ''); } catch (e) {} }
window.addEventListener('popstate', () => {
  const ov = document.querySelector('.modalbg'), dr = document.querySelector('.dragon'), it = document.querySelector('.intro');
  if (ov) ov.close ? ov.close() : ov.remove();
  else if (dr) dr.remove();
  else if (it) it.querySelector('.skip').click();
  else if (R.stack.length) back();
  else if (R.screen !== 'today') { R.stack = []; R.date = today(); go('today', {}, false); }
  else if (R.date !== today()) { R.date = today(); render(); }
  armBack();
});

/* ---------- Boot ---------- */
(async function boot() {
  await load();
  const start = () => { R.date = today(); render(); };
  // An image shared from the Xiaomi app arrives through the service worker (see sw.js) as ?share=1
  let shared = null;
  if (/[?&]share=1/.test(location.search)) { try { history.replaceState(null, '', './'); const c = await caches.open('vikac-share'); const r = await c.match('shared-image'); if (r) { shared = await r.blob(); await c.delete('shared-image'); } } catch (e) {} }
  if (shared && S.project) { S.meta.introSeen = true; R.stack = []; go('import', { file: shared }, false); }
  else if (!S.meta.introSeen) { S.meta.introSeen = true; save(); render(); playIntro(start); } else start();
  document.addEventListener('visibilitychange', () => { if (!document.hidden && R.screen === 'today' && R.date !== today() && R.stack.length === 0) { R.date = today(); render(); } });
  armBack();
  if (ghOn() && GH.pending) setTimeout(() => syncNow({ quiet: true }), 2500);
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }
})();
</script>
