<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Vikač High Kikač</title>
<meta name="theme-color" content="#FE7F0C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:'Bangers';font-style:normal;font-weight:400;font-display:swap;src:url(font/bangers-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Bangers';font-style:normal;font-weight:400;font-display:swap;src:url(font/bangers-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'BarlowC';font-weight:700;font-display:swap;src:url(font/barlowc-latin-ext-700.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'BarlowC';font-weight:700;font-display:swap;src:url(font/barlowc-latin-700.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'BarlowC';font-weight:600;font-display:swap;src:url(font/barlowc-latin-ext-600.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'BarlowC';font-weight:600;font-display:swap;src:url(font/barlowc-latin-600.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --paper:#FFF6EA;--paper2:#FFEEDB;--card:#FFFFFF;--ink:#1B1B1B;--ink2:#3A3A3A;--muted:#6E6E6E;--line:#E6D9C8;
  --or:#FE7F0C;--or2:#D45E00;--orsoft:#FFE4C8;--yel:#FFD400;
  --ok:#1E8E3E;--oksoft:#DDF5E3;--warn:#C96A00;--warnsoft:#FFE9CF;--bad:#D93025;--badsoft:#FDE0DD;
  --beam:#1FA2FF;--beam2:#8AF3FF;--blue:#1C6DD0;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --shadow:4px 4px 0 var(--ink);--shadow-sm:3px 3px 0 var(--ink);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.35;overscroll-behavior:none}
body{min-height:100vh;min-height:100dvh;background-image:radial-gradient(rgba(254,127,12,.10) 1.2px,transparent 1.2px);background-size:14px 14px}
h1,h2,h3{margin:0;font-weight:700}
.bang{font-family:'Bangers',Impact,'Arial Narrow Bold',sans-serif;letter-spacing:.04em;line-height:.92}
.cond{font-family:'BarlowC','Arial Narrow',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.title{font-family:'Bangers',Impact,sans-serif;letter-spacing:.04em;line-height:.9;color:var(--or);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke;text-shadow:3px 3px 0 var(--ink);transform:rotate(-3deg)}
.title.sm{font-size:30px;transform:none;text-shadow:2px 2px 0 var(--ink);-webkit-text-stroke:1px var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:8px;padding:10px 12px;width:100%;outline:none}
input:focus,textarea:focus{box-shadow:3px 3px 0 var(--or)}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
label{display:block;font-family:'BarlowC',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:13px;color:var(--ink2);margin:0 0 4px}
.field{margin-bottom:12px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.screen{padding:calc(10px + var(--sat)) 14px calc(88px + var(--sab));max-width:560px;margin:0 auto;animation:snap .18s ease-out}
@keyframes snap{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
/* header band */
.band{position:relative;margin:-10px -14px 14px;padding:calc(14px + var(--sat)) 18px 22px;background:var(--or);background-image:radial-gradient(rgba(0,0,0,.14) 1.5px,transparent 1.6px);background-size:10px 10px;color:#fff;clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),0 100%);border-bottom:3px solid var(--ink)}
.band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:var(--ink);clip-path:polygon(0 100%,100% 0,100% 100%)}
.band .h{font-family:'Bangers',Impact,sans-serif;font-size:34px;max-width:60%;letter-spacing:.04em;line-height:.95;color:#fff;-webkit-text-stroke:1.2px var(--ink);paint-order:stroke;text-shadow:3px 3px 0 var(--ink)}
.band .sub{font-family:'BarlowC',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--ink);margin-top:4px;max-width:62%}
.band .right{position:absolute;right:14px;top:calc(12px + var(--sat));text-align:right}
.band .right .big{font-family:'Bangers',Impact,sans-serif;font-size:44px;line-height:.9;color:#fff;-webkit-text-stroke:1.2px var(--ink);paint-order:stroke;text-shadow:3px 3px 0 var(--ink)}
.band .right .big small{font-size:20px}
.band .right .sub{color:var(--ink)}
.topbar{display:flex;align-items:center;gap:12px;margin:4px 0 14px;min-height:44px}
.back{width:44px;height:44px;border-radius:10px;background:#fff;border:2px solid var(--ink);box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}
.back:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.topbar .t{font-family:'Bangers',Impact,sans-serif;font-size:28px;letter-spacing:.04em;line-height:1}
.topbar .s{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--or);color:var(--ink);font-family:'BarlowC',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:18px;border:2.5px solid var(--ink);border-radius:10px;padding:12px 18px;min-height:50px;width:100%;box-shadow:var(--shadow);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.sec{background:#fff}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--muted);color:var(--muted)}
.btn.sm{width:auto;min-height:42px;padding:6px 14px;font-size:15px;box-shadow:var(--shadow-sm)}
.card{background:var(--card);border:2.5px solid var(--ink);border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;border-width:2px}
.card h3{font-family:'Bangers',Impact,sans-serif;font-size:24px;letter-spacing:.04em;font-weight:400;margin-bottom:6px}
.sec-h{font-family:'Bangers',Impact,sans-serif;font-size:28px;letter-spacing:.04em;margin:18px 0 10px;display:flex;align-items:center;gap:10px}
.sec-h::after{content:"";flex:1;height:3px;background:var(--ink);transform:skewX(-30deg)}
.muted{color:var(--muted);font-size:13px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.or{color:var(--or2)}
.small{font-size:13px}.big{font-size:22px;font-weight:800}
.center{text-align:center}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:#fff;border-top:3px solid var(--ink);padding:6px 0 calc(6px + var(--sab));z-index:20}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:'BarlowC',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:12px;color:var(--muted);padding:4px 0;min-height:52px}
.nav button.on{color:var(--or2)}
.nav button.on svg{filter:drop-shadow(2px 2px 0 var(--ink))}
.nav svg{width:26px;height:26px}
.funline{font-family:'BarlowC',sans-serif;font-weight:600;font-size:17px;margin:0 0 12px;padding:10px 14px;background:#fff;border:2px solid var(--ink);border-radius:12px;position:relative;box-shadow:var(--shadow-sm)}
.funline::before{content:"";position:absolute;left:22px;bottom:-10px;border:8px solid transparent;border-top-color:var(--ink);border-bottom:0}
.funline::after{content:"";position:absolute;left:24px;bottom:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
.pill{display:inline-flex;align-items:center;gap:4px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:5px 12px;font-family:'BarlowC',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:13px;min-height:34px}
.pill.or{background:var(--or);color:var(--ink)}
/* checklist */
.todo{list-style:none;margin:0;padding:0}
.todo li{position:relative;display:flex;align-items:center;gap:12px;background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:10px 10px 10px 10px;margin-bottom:10px;min-height:64px;overflow:hidden;box-shadow:var(--shadow-sm)}
.todo .chk{width:36px;height:36px;border-radius:8px;border:2.5px solid var(--ink);flex:none;display:flex;align-items:center;justify-content:center;background:#fff;transition:background .15s}
.todo .chk svg{width:22px;height:22px;opacity:0;transform:scale(.4);transition:all .2s}
.todo li.done{background:var(--paper2)}
.todo li.done .chk{background:var(--or)}
.todo li.done .chk svg{opacity:1;transform:none}
.todo .lab{flex:1;min-width:0;padding:2px 0}
.todo .lab .t{font-family:'BarlowC',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:19px;position:relative;display:inline-block;transition:opacity .25s;line-height:1.1}
.todo .lab .t::after{content:"";position:absolute;left:-2px;right:-2px;top:52%;height:4px;background:var(--beam);border-radius:2px;transform:scaleX(0);transform-origin:left;transition:transform .35s ease-out .25s;box-shadow:0 0 6px var(--beam)}
.todo li.done .lab .t{opacity:.45}
.todo li.done .lab .t::after{transform:scaleX(1)}
.todo .lab .s{font-size:13px;color:var(--muted);margin-top:2px}
.todo .go{color:var(--ink);font-size:22px;padding:0 6px;font-weight:700}
.todo .tag{position:absolute;right:38px;top:-2px;font-family:'BarlowC',sans-serif;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border:2px solid var(--ink);border-top:0;border-radius:0 0 6px 6px;background:var(--or)}
.zap{position:absolute;left:52px;top:50%;height:40px;width:70px;transform:translate(-20px,-50%);pointer-events:none;opacity:0}
.zap.play{animation:zap .75s ease-out forwards}
@keyframes zap{0%{opacity:0;transform:translate(-24px,-50%) scale(.6)}15%{opacity:1;transform:translate(0,-50%) scale(1)}70%{opacity:1;transform:translate(6px,-50%) scale(1)}100%{opacity:0;transform:translate(12px,-50%) scale(1)}}
.burst{position:absolute;right:60px;top:50%;width:46px;height:46px;transform:translateY(-50%) scale(0);pointer-events:none}
.burst.play{animation:burst .6s ease-out forwards}
@keyframes burst{0%{transform:translateY(-50%) scale(0);opacity:1}60%{transform:translateY(-50%) scale(1.2);opacity:1}100%{transform:translateY(-50%) scale(1.4);opacity:0}}
/* dragon balls */
.balls{display:flex;justify-content:center;gap:8px;margin:16px 0 6px}
.ball{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8 0,#fff0 40%),radial-gradient(circle at 50% 50%,#FFB347,#FE7F0C 60%,#C25400);border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);position:relative;transition:all .3s}
.ball.off{background:#fff;box-shadow:none;border-style:dashed;border-color:#C9B9A5}
.ball::after{content:"";position:absolute;left:10px;top:8px;width:9px;height:9px;background:#fff;border-radius:50%;opacity:.6}
.ball.off::after{display:none}
.ball.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
/* beam bar */
.beam{background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:10px 12px 8px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.beam .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.beam .hd .n{font-family:'BarlowC',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:18px}
.beam .hd .g{font-size:13px;color:var(--muted)}
.beam svg{width:100%;height:auto;display:block}
.beam .st{font-size:14px;margin-top:2px;font-weight:700}
.tabs{display:flex;gap:6px;margin:8px 0 12px}
.tabs button{flex:1;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:9px 0;font-family:'BarlowC',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:15px;color:var(--ink);min-height:44px}
.tabs button.on{background:var(--or);box-shadow:var(--shadow-sm)}
/* modal */
.modalbg{position:fixed;inset:0;background:rgba(27,27,27,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;animation:snap .15s}
.modal{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:18px;width:100%;max-width:440px;max-height:85vh;overflow:auto;box-shadow:6px 6px 0 var(--ink)}
.modal h3{font-family:'Bangers',Impact,sans-serif;font-size:28px;letter-spacing:.04em;font-weight:400;margin-bottom:8px}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:14px;margin:8px 0}
.kv b{font-weight:800}
.dots{display:flex;gap:4px;align-items:flex-end;height:30px;margin:6px 0}
.dots i{flex:1;background:var(--beam);border:1.5px solid var(--ink);border-bottom:0;border-radius:3px 3px 0 0;min-height:4px}
/* workout */
.ex{background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.ex .nm{font-family:'BarlowC',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:19px;line-height:1.1}
.ex .sch{font-size:13px;color:var(--or2);font-weight:700}
.ex .last{font-size:13px;color:var(--ink2);margin:6px 0 8px;background:var(--paper2);border-radius:8px;padding:6px 8px;border:1.5px dashed #D9B68E}
.sets{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:center}
.sets span{font-size:13px;color:var(--muted);width:26px;font-weight:700}
.sets input{padding:8px 10px;text-align:center}
.ex textarea{margin-top:8px;min-height:40px;resize:vertical}
.ex .verdict{font-size:14px;margin-top:8px;font-weight:700}
.exchk{width:36px;height:36px;border-radius:8px;border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;background:#fff;flex:none}
.exchk.on{background:var(--or)}
.exchk svg{width:22px;height:22px}
/* stretch */
.step{background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.step img{width:100%;border-radius:8px;display:block;margin-top:8px;border:2px solid var(--ink)}
.step .tm{display:flex;align-items:center;gap:10px;margin-top:10px}
.step .tm .t{font-family:'Bangers',Impact,sans-serif;font-size:30px;color:var(--or2);min-width:70px;letter-spacing:.04em}
/* avatar */
.avatar{display:flex;gap:10px;align-items:center;margin-bottom:14px;background:#fff;border:2.5px solid var(--ink);border-radius:12px;box-shadow:var(--shadow);padding:10px 14px;position:relative;overflow:hidden}
.avatar::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 50%,var(--orsoft) 0,transparent 55%)}
.avatar>*{position:relative}
.avatar svg{width:120px;height:180px;flex:none}
.score{font-family:'Bangers',Impact,sans-serif;font-size:56px;color:var(--or);-webkit-text-stroke:1.2px var(--ink);paint-order:stroke;text-shadow:3px 3px 0 var(--ink);line-height:1;letter-spacing:.03em}
.lvl{font-family:'BarlowC',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:18px}
/* calendar */
.cal{background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:12px;box-shadow:var(--shadow);margin-bottom:14px}
.cal .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal .mh .m{font-family:'Bangers',Impact,sans-serif;font-size:30px;letter-spacing:.04em}
.cal .mh button{width:44px;height:44px;border:2px solid var(--ink);border-radius:8px;background:#fff;font-size:20px;font-weight:700;box-shadow:2px 2px 0 var(--ink)}
.cal .mh button:disabled{opacity:.3;box-shadow:none}
.ring{display:flex;align-items:center;gap:14px;margin:4px 0 12px}
.ring svg{width:84px;height:84px;flex:none}
.ring .pct{font-family:'Bangers',Impact,sans-serif;font-size:26px}
.wd{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.wd span{text-align:center;font-family:'BarlowC',sans-serif;font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{aspect-ratio:1/1.1;border:2px solid var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:700;font-size:14px;background:#fff;position:relative;min-height:44px}
.cell.out{opacity:.25;border-style:dashed}
.cell.in{border-color:var(--ink)}
.cell.today{box-shadow:0 0 0 3px var(--or)}
.cell.sel{background:var(--or);}
.cell .w{font-family:'BarlowC',sans-serif;font-size:10px;letter-spacing:.04em;text-transform:uppercase;padding:0 4px;border-radius:4px;color:#fff;line-height:14px}
.cell .w.push{background:#E05A00}.cell .w.pull{background:#1C6DD0}.cell .w.legs{background:#1E8E3E}.cell .w.mt{background:#C2185B}.cell .w.rest{background:#8A8A8A}
.cell .m{position:absolute;right:2px;top:2px;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink);font-size:9px;display:flex;align-items:center;justify-content:center;background:#fff;line-height:1}
.cell .m.done{background:var(--ok);color:#fff}.cell .m.part{background:var(--yel)}.cell .m.miss{background:var(--badsoft);color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink);vertical-align:-1px;margin-right:3px}
.dl{list-style:none;margin:0;padding:0}
.dl li{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1.5px solid var(--line);min-height:48px}
.dl li:last-child{border-bottom:0}
.dl .n{font-family:'Bangers',Impact,sans-serif;font-size:22px;width:44px;color:var(--or2);letter-spacing:.03em}
.dl .w{flex:1;font-family:'BarlowC',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:16px}
.dl .w small{display:block;font-family:system-ui;font-weight:400;text-transform:none;letter-spacing:0;font-size:12px;color:var(--muted)}
.dl .st{font-size:18px;width:28px;text-align:center}
.dl li.today{background:var(--orsoft);border-radius:8px}
/* intro */

<body>
<div id="app"></div>
<script>
/* ============ Vikač High Kikač — core (data + math) ============ */
'use strict';
const APP_VERSION = '1.1.1';

/* ---------- Program ---------- */
// type: main (kg×reps sets), hn (heavy + normal sets), max (5-min MAX: reps + load), ctrl (heavy/controlled)
const EX = (n, s, sets, type) => ({ n, s, sets, type: type || 'main' });
const PROGRAM = {
  cycle: [
    { d: 1, w: 'push' }, { d: 2, w: 'mt' }, { d: 3, w: 'rest' }, { d: 4, w: 'legs' },
    { d: 5, w: 'rest', noHang: true, noStretch: true }, { d: 6, w: 'mt' }, { d: 7, w: 'pull' }, { d: 8, w: 'rest' },
  ],
  mobilityDays: [2, 4, 6],
  workouts: {
    pushA: { name: 'Push A', group: 'push', ex: [
      EX('DB bench press', '3 × 5 @ 85% 1RM', 3),
      EX('DB overhead press', '3 × 4–6 @ 2 RIR', 3),
      EX('Close grip DB press', '3 × 4–6 @ 2 RIR', 3),
      EX('Cable crossovers', '1 × 3–5 heavy, 2 × 6–10', 3, 'hn'),
      EX('DB overhead extensions', '1 × 3–5 heavy, 2 × 6–10', 3, 'hn'),
      EX('DB side lateral raises', '1 × 3–5 heavy, 2 × 6–10', 3, 'hn'),
      EX('Weighted pushups', '5 min MAX', 1, 'max'),
    ]},
    pushB: { name: 'Push B', group: 'push', ex: [
      EX('DB bench press', '3 × 5 @ 85% 1RM', 3),
      EX('Incline DB bench press', '3 × 4–6 @ 2 RIR', 3),
      EX('DB overhead press', '3 × 4–6 @ 2 RIR', 3),
      EX('Triceps pushdown', '1 × 3–5 heavy, 2 × 6–10', 3, 'hn'),
      EX('DB hip huggers', '1 × 3–5 heavy, 2 × 6–10', 3, 'hn'),
      EX('Low to high crossovers', '1 × 3–5 heavy, 2 × 6–10', 3, 'hn'),
      EX('Pushups', '5 min MAX', 1, 'max'),
    ]},
    legsA: { name: 'Legs A', group: 'legs', ex: [
      EX('BB squats', '3 × 5 @ 85% 1RM', 3),
      EX('Alternating reverse DB lunges', '3 × 4–6 / side @ 2 RIR', 3),
      EX('Leg curl', '1 × 8 heavy, 2 × 12 controlled', 3, 'hn'),
      EX('Leg extension', '3 × 8 heavy, 1 × 12 controlled', 4, 'hn'),
      EX('DB alternating step ups', '1 × 3–5 heavy, 2 × 6–10', 3, 'hn'),
      EX('DB stiff leg deadlift', '1 × 3–5 heavy, 2 × 6–10', 3, 'hn'),
      EX('DB standing calf raises', '1 × 3–5 heavy, 2 × 6–10', 3, 'hn'),
      EX('DB goblet squats', '5 min MAX', 1, 'max'),
    ]},
    legsB: { name: 'Legs B', group: 'legs', ex: [
      EX('BB squats', '3 × 5 @ 85% 1RM', 3),
      EX('BB RDL', '3 × 4–6 @ 2 RIR', 3),
      EX('Bag swings', '3 × 4–6 @ 2 RIR', 3),
      EX('Alternating reverse DB lunges', '1 × 3–5 heavy, 2 × 6–10', 3, 'hn'),
      EX('DB jump squats', '1 × 3–5 heavy, 2 × 6–10', 3, 'hn'),
      EX('DB seated calf raises', '1 × 3–5 heavy, 2 × 6–10', 3, 'hn'),
      EX('Creeping lunges', '5 min MAX', 1, 'max'),
    ]},
    pullA: { name: 'Pull A', group: 'pull', ex: [
      EX('Deadlift', '3 × 5 @ 85% 1RM', 3),
      EX('Barbell shrugs', '3 × 4–6 @ 2 RIR', 3),
      EX('Weighted chins', '3 × 4–6 @ 2 RIR', 3),
      EX('Lat pulldowns', '1 × 3–5 heavy, 2 × 6–10 controlled', 3, 'hn'),
      EX('Face pulls', '1 × 3–5 heavy, 3 × 6–10 controlled', 4, 'hn'),
      EX('Standing DB curls', '1 × 3–5 heavy, 2 × 6–10 controlled', 3, 'hn'),
      EX('Pullups', '5 min MAX', 1, 'max'),
    ]},
    pullB: { name: 'Pull B', group: 'pull', ex: [
      EX('Deadlift', '3 × 5 @ 85% 1RM', 3),
      EX('Barbell curls', '3 × 4–6 @ 2 RIR', 3),
      EX('Weighted pullups', '3 × 4–6 @ 2 RIR', 3),
      EX('Seated cable rows', '1 × 3–5 heavy, 2 × 6–10 controlled', 3, 'hn'),
      EX('Straight arm pushdowns', '1 × 3–5 heavy, 2 × 6–10 controlled', 3, 'hn'),
      EX('Cross body hammer curls', '1 × 3–5 heavy, 2 × 6–10 controlled', 3, 'hn'),
      EX('Face pulls', '5 min MAX', 1, 'max'),
    ]},
  },
};
const STRETCH = [
  { t: 'Sjedenje na koljenima', d: 30 },
  { t: 'Sjedenje na koljenima, ali se podignuti', d: 30 },
  { t: '2 × 15 podizanje na koljena', d: 30 },
  { t: 'Izvući nogu i podignutu nogu gurati prema van', d: 45, sides: 2, img: 'img/stretch4.jpg' },
  { t: 'Asian squat', d: 90 },
  { t: 'Rotirati unutarnju ruku kao na slici', d: 45, sides: 2, img: 'img/stretch6.jpg' },
  { t: "World's greatest stretch — stopalo rotirati na vanjsku stranu", d: 45, sides: 2, img: 'img/stretch7a.jpg' },
  { t: "World's greatest stretch — stopalo rotirati jače prema van", d: 45, sides: 2, img: 'img/stretch7b.jpg' },
  { t: 'Prva slika', d: 30, sides: 2, img: 'img/stretch8a.jpg' },
  { t: 'Druga slika', d: 30, sides: 2, img: 'img/stretch8b.jpg' },
  { t: 'Treća slika', d: 30, sides: 2, img: 'img/stretch8c.jpg' },
];

/* ---------- State + persistence ---------- */
const DEFAULT_PROJECT = {
  name: 'Vikač High Kikač', startDate: '2026-11-03', endDate: '2026-12-31',
  deficit: 500, bmr: 1750, protein: 180, waterDrop: 0.5, bandDefault: 300,
  height: 183, age: 31.5,
  start: { weight: 83.3, fat: 22.7, muscle: 60.9, skeletal: 33.5, visceral: 10, water: 55 },
};
let S = { project: null, days: {}, readings: {}, sessions: [], targets: {}, meta: { schema: 1, lastBackup: null, introSeen: false, createdAt: null } };
const LS_KEY = 'vikac.state.v1';
let idb = null;
function idbOpen() {
  return new Promise(res => {
    try {
      const r = indexedDB.open('vikac', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
    } catch (e) { res(null); }
  });
}
function idbGet() {
  return new Promise(res => {
    if (!idb) return res(null);
    try { const tx = idb.transaction('kv'); const q = tx.objectStore('kv').get('state'); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); } catch (e) { res(null); }
  });
}
function idbPut(v) { try { if (idb) idb.transaction('kv', 'readwrite').objectStore('kv').put(v, 'state'); } catch (e) {} }
let saveTimer = null;
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
  clearTimeout(saveTimer); saveTimer = setTimeout(() => idbPut(JSON.stringify(S)), 150);
}
async function load() {
  idb = await idbOpen();
  let raw = null;
  try { raw = localStorage.getItem(LS_KEY); } catch (e) {}
  if (!raw) raw = await idbGet();
  if (raw) { try { const o = JSON.parse(raw); S = Object.assign(S, o); } catch (e) {} }
  if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch (e) {} }
}

/* ---------- Dates ---------- */
const pad = n => (n < 10 ? '0' : '') + n;
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parse(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function today() { return ymd(new Date()); }
function addDays(s, n) { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); }
function diffDays(a, b) { return Math.round((parse(b) - parse(a)) / 864e5); }
const WD = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function fmtDate(s) { const d = parse(s); return WD[d.getDay()] + ', ' + d.getDate() + ' ' + MO[d.getMonth()] + ' ' + d.getFullYear(); }
function fmtShort(s) { const d = parse(s); return d.getDate() + ' ' + MO[d.getMonth()]; }

/* ---------- Project helpers ---------- */
const P = () => S.project;
function D() { return diffDays(P().startDate, P().endDate); }           // days of deficit (58)
function tOf(date) { return diffDays(P().startDate, date); }            // 0 on Day 1
function goalWeight() { const p = P(); return Math.round((p.start.weight - p.deficit * D() / 7700) * 10) / 10; }
function rate() { return (P().start.weight - goalWeight()) / D(); }     // kg/day

function dayInfo(date) {
  const t = tOf(date), idx = t + 1, Dd = D();
  if (t < 0) return { t, idx, phase: 'pre' };
  if (t > Dd) return { t, idx, phase: 'post' };
  const cd = ((t % 8) + 8) % 8, cyc = PROGRAM.cycle[cd], cycleNum = Math.floor(t / 8) + 1;
  const variant = cycleNum % 2 === 1 ? 'A' : 'B';
  const workoutKey = cyc.w === 'rest' || cyc.w === 'mt' ? null : cyc.w + variant;
  const items = [{ id: 'weigh', label: 'Morning weigh-in', sub: 'Log the scale' }];
  if (cyc.w === 'mt') items.push({ id: 'mt', label: 'Muay Thai', sub: 'Bag work / class — log minutes' });
  if (workoutKey) items.push({ id: 'workout', key: workoutKey, label: PROGRAM.workouts[workoutKey].name, sub: PROGRAM.workouts[workoutKey].ex.length + ' exercises' });
  if (PROGRAM.mobilityDays.includes(cyc.d)) items.push({ id: 'mobility', label: 'Kick mobility warm-up', sub: 'Range of motion routine' });
  if (!cyc.noHang) items.push({ id: 'hang', label: 'Dead hangs — 3 min', sub: 'Log your best hang' });
  if (!cyc.noStretch) items.push({ id: 'stretch', label: 'Stretching for kicks', sub: '11 steps · ~13 min' });
  items.push({ id: 'nutrition', label: 'Nutrition', sub: 'Calories · protein · band kcal' });
  return { t, idx, phase: t === Dd ? 'final' : 'on', cycleDay: cyc.d, cycleNum, variant, workoutKey, isRest: cyc.w === 'rest', isMT: cyc.w === 'mt', items, daysLeft: Dd - t };
}
function day(date) { return S.days[date] || (S.days[date] = { done: {} }); }
function isDone(date, id) {
  const d = S.days[date]; if (!d) return false;
  if (d.done[id]) return true;
  if (id === 'weigh') return !!S.readings[date];
  if (id === 'nutrition') return !!(d.nutrition && d.nutrition.kcal);
  if (id === 'hang') return !!(d.hang && d.hang.best);
  if (id === 'mt') return !!(d.mt && d.mt.minutes);
  if (id === 'workout') return S.sessions.some(s => s.date === date && s.finished);
  return false;
}

/* ---------- Nutrition ---------- */
function nutritionCalc(date) {
  const d = S.days[date], p = P(); const n = d && d.nutrition; if (!n || !n.kcal) return null;
  const band = n.band == null || n.band === '' ? p.bandDefault : +n.band;
  const target = p.bmr + band - p.deficit;
  const balance = +n.kcal - (p.bmr + band);
  const def = -balance; // positive = deficit
  const lo = p.deficit - 100, hi = p.deficit + 100;
  let pts = 0, verdict, cls;
  if (def >= lo && def <= hi) { pts = 1; verdict = 'Textbook! −' + def + ' on the day.'; cls = 'ok'; }
  else if (def >= p.deficit - 200 && def < lo) { pts = .5; verdict = 'A bit soft today (−' + def + '). Still a win.'; cls = 'warn'; }
  else if (def > hi && def <= p.deficit + 300) { pts = .5; verdict = 'Slightly deep (−' + def + '). Fine once, not daily.'; cls = 'warn'; }
  else if (def > p.deficit + 300) { pts = 0; verdict = "That's too deep (−" + def + '). Eat something, champion.'; cls = 'bad'; }
  else { pts = 0; verdict = def > 0 ? 'Only −' + def + '. The plan says −' + p.deficit + '.' : 'Surplus of +' + (-def) + '. Happens! Fresh page tomorrow.'; cls = 'bad'; }
  const prot = +n.protein || 0;
  const ppts = prot >= p.protein ? 1 : prot >= p.protein - 20 ? .5 : 0;
  return { band, target, balance, def, pts, verdict, cls, prot, ppts, bandAssumed: n.band == null || n.band === '' };
}

/* ---------- Dragon balls ---------- */
function dragonBalls(date) {
  const info = dayInfo(date); if (!info.items) return { balls: 0, earned: 0, avail: 0, rows: [] };
  let earned = 0, avail = 0; const rows = [];
  for (const it of info.items) {
    avail += 1; let pts = 0, note = '';
    if (it.id === 'nutrition') {
      avail += 1; // protein is a second point
      const nc = nutritionCalc(date);
      if (nc) { pts = nc.pts + nc.ppts; note = 'kcal ' + nc.pts + ' + protein ' + nc.ppts; } else note = 'not logged';
      rows.push({ label: 'Calories + protein', pts, max: 2, note }); earned += pts; continue;
    }
    if (it.id === 'workout') {
      const s = S.sessions.find(x => x.date === date);
      if (s && s.finished) { pts = 1; note = 'finished'; }
      else if (s) { const done = s.ex.filter(e => e.done).length; if (done >= s.ex.length / 2) { pts = .5; note = done + '/' + s.ex.length + ' exercises'; } }
      else if (isDone(date, it.id)) { pts = 1; note = 'ticked'; }
    } else if (it.id === 'weigh') {
      const r = S.readings[date];
      if (r) { pts = r.late ? .5 : 1; note = r.late ? 'logged late' : 'logged'; } else if (isDone(date, 'weigh')) { pts = 1; note = 'ticked'; }
    } else pts = isDone(date, it.id) ? 1 : 0;
    earned += pts; rows.push({ label: it.label, pts, max: 1, note });
  }
  return { balls: avail ? Math.floor(7 * earned / avail + 1e-9) : 0, earned, avail, rows };
}

function dayCompletion(date) {
  const info = dayInfo(date); if (!info.items) return 'none';
  const db = dragonBalls(date); if (db.avail && db.earned >= db.avail) return 'done'; if (db.earned > 0) return 'part';
  return date < today() ? 'miss' : 'future';
}
function workoutTag(info) { if (!info.items) return null; if (info.isMT) return { k: 'mt', t: 'MT' }; if (info.isRest) return { k: 'rest', t: 'Rest' }; const g = PROGRAM.workouts[info.workoutKey].group; return { k: g, t: g === 'push' ? 'Push ' + info.variant : g === 'pull' ? 'Pull ' + info.variant : 'Legs ' + info.variant }; }

/* ---------- Readings + metrics ---------- */
const METRIC_DEFS = [
  { id: 'weight', label: 'Weight', unit: 'kg', dec: 1, dir: -1 },
  { id: 'fat', label: 'Body fat', unit: '%', dec: 1, dir: -1 },
  { id: 'muscle', label: 'Muscle mass', unit: 'kg', dec: 1, dir: 1 },
  { id: 'skeletal', label: 'Skeletal muscle', unit: 'kg', dec: 1, dir: 1 },
  { id: 'visceral', label: 'Visceral fat', unit: '', dec: 0, dir: -1, avg: 14 },
];
function expected(id, t) {
  const p = P(), s = p.start, r = rate(), Dd = D();
  const wd = p.waterDrop || 0;
  const rw = r - wd * (1 - Math.exp(-Dd / 4)) / Dd;                     // weight line still lands exactly on the goal
  const W = tt => s.weight - rw * tt - wd * (1 - Math.exp(-tt / 4));
  const FM0 = s.weight * s.fat / 100;
  switch (id) {
    case 'weight': return W(t);
    case 'fat': return (FM0 - 0.85 * r * t) / W(t) * 100;
    case 'muscle': return s.muscle - 0.15 * r * t;
    case 'skeletal': return s.skeletal - 0.08 * r * t;
    case 'visceral': return Math.round(s.visceral - 2 * t / Dd);
  }
}
function tolerance(id, t) {
  switch (id) { case 'weight': return t <= 10 ? 0.9 : 0.6; case 'fat': return 1.0; case 'muscle': return 0.8; case 'skeletal': return 0.5; case 'visceral': return 1; }
}
function readingsUpTo(date, n) { // last n days ending at date, with values
  const out = [];
  for (let i = 0; i < n; i++) { const d = addDays(date, -i); if (S.readings[d]) out.push({ date: d, r: S.readings[d] }); }
  return out;
}
function avgField(list, f) { const v = list.map(x => x.r[f]).filter(x => x != null && x !== ''); return v.length ? v.reduce((a, b) => a + +b, 0) / v.length : null; }
function current(id, date) {
  const n = (METRIC_DEFS.find(m => m.id === id) || {}).avg || 7;
  return avgField(readingsUpTo(date, n), id);
}
function lastReading(id, date) { for (let i = 0; i < 60; i++) { const d = addDays(date, -i); const r = S.readings[d]; if (r && r[id] != null && r[id] !== '') return { date: d, v: +r[id] }; } return null; }
function rate14(id, date) { // kg/day from two 7-day windows
  const a = avgField(readingsUpTo(date, 7), id), b = avgField(readingsUpTo(addDays(date, -7), 7), id);
  if (a == null || b == null) return null; return (a - b) / 7;
}
function metricStatus(id, date) {
  const def = METRIC_DEFS.find(m => m.id === id), p = P(), s = p.start; if (s[id] == null || s[id] === '') return null;
  const t = Math.max(0, Math.min(D(), tOf(date))), exp = expected(id, t), tol = tolerance(id, t), cur = current(id, date);
  const goal = expected(id, D()), start = +s[id];
  const o = { id, def, t, exp, tol, cur, goal, start, daysLeft: D() - t, state: 'nodata', text: 'No readings yet. Hop on the scale!', cls: 'muted' };
  if (cur == null) return o;
  const diff = cur - exp, r14 = rate14(id, date);
  const f = v => v.toFixed(def.dec) + (def.unit === '%' ? ' %' : def.unit ? ' ' + def.unit : '');
  const head = f(start) + ' → ' + f(cur) + ' in ' + t + ' day' + (t === 1 ? '' : 's') + '. ';
  if (def.dir < 0) {
    if (diff > tol) { o.state = 'slow'; o.text = head + 'Too slow brother.'; o.cls = 'warn'; }
    else if (diff < -tol) {
      const wkPct = r14 != null && id === 'weight' ? -r14 * 7 / cur * 100 : null;
      if (id === 'weight' && wkPct != null && wkPct > 1.0) { o.state = 'fast'; o.text = head + 'Slow down my man.'; o.cls = 'warn'; }
      else { o.state = 'ahead'; o.text = head + 'Ahead of the line. Easy, tiger!'; o.cls = 'ok'; }
    } else { o.state = 'zone'; o.text = head + 'In the green!'; o.cls = 'ok'; }
  } else {
    if (diff < -tol) { o.state = 'slow'; o.text = head + 'Losing muscle. Eat your ' + p.protein + ' g.'; o.cls = 'warn'; }
    else if (diff > tol) { o.state = 'ahead'; o.text = head + 'Gaining on a cut. Legend!'; o.cls = 'ok'; }
    else { o.state = 'zone'; o.text = head + 'Holding. In the green!'; o.cls = 'ok'; }
  }
  o.diff = diff; o.r14 = r14; o.proj = r14 != null ? cur + r14 * o.daysLeft : null;
  // action line
  if (def.dir < 0 && id === 'weight') {
    const kcal = Math.round(Math.abs(diff) * 7700 / Math.max(1, o.daysLeft));

/* ---------- Dashboard ---------- */
function metricBar(st, date) {
  const def = st.def, t = Math.max(0, Math.min(D(), tOf(date))), tf = t / D();
  const span = st.start - st.goal; let frac = 0, ef = null;
  if (def.dir < 0) { frac = st.cur == null ? 0 : (st.start - st.cur) / span; ef = (st.start - st.exp) / span; }
  else { frac = st.cur == null ? 0 : tf; ef = tf; }
  const u = def.unit === '%' ? ' %' : def.unit ? ' ' + def.unit : '';
  return `<div class="beam" data-metric="${def.id}"><div class="hd"><span class="n">${def.label}</span><span class="g">${st.cur != null ? 'now ' + st.cur.toFixed(def.dec) + u : 'no data'}</span></div>
    ${beamSvg({ frac, expFrac: ef, timeFrac: tf, state: st.state === 'ahead' ? 'zone' : st.state, left: st.start.toFixed(def.dec) + u, right: 'GOAL ' + st.goal.toFixed(def.dec) + u })}
    <div class="st ${st.cls}">${esc(st.text)}</div></div>`;
}
function exerciseBar(name, date) {
  const type = exType(name), hist = exerciseHistory(name); const tgt = S.targets[name] || (type === 'max' ? 1.25 : 1.03);
  if (!hist.length) return `<div class="beam" data-ex="${esc(name)}"><div class="hd"><span class="n">${esc(name)}</span><span class="g">not logged yet</span></div>${beamSvg({ frac: 0, state: 'nodata', left: '—', right: type === 'max' ? 'GOAL +25 %' : 'GOAL HOLD / +3 %' })}<div class="st muted">Log it in a workout to start the beam.</div></div>`;
  const first = hist[0].v, last = hist[hist.length - 1].v, goal = first * tgt, span = goal - first;
  const frac = span > 0 ? Math.max(0, (last - first) / span) : 1;
  const lastSess = S.sessions.filter(s => s.finished && s.ex.some(e => e.n === name && exScore(e, type).v > 0)).sort((a, b) => a.date < b.date ? 1 : -1)[0];
  const e = lastSess.ex.find(x => x.n === name), v = verdictFor(name, e, lastSess.date, lastSess.id);
  const state = v.state === 'down' ? 'slow' : v.state === 'jump' ? 'fast' : 'zone';
  const u = type === 'max' ? ' reps' : ' kg';
  const f = x => type === 'max' ? Math.round(x) + u : Math.round(x) + u + ' e1RM';
  return `<div class="beam" data-ex="${esc(name)}"><div class="hd"><span class="n">${esc(name)}</span><span class="g">${hist.length} session${hist.length === 1 ? '' : 's'}</span></div>
    ${beamSvg({ frac: Math.min(1, frac), expFrac: null, timeFrac: Math.max(0, Math.min(1, tOf(date) / D())), state, left: f(first), right: 'GOAL ' + f(goal) })}
    <div class="st ${v.cls}">${esc(v.text)}</div></div>`;
}
function dashHtml() {
  const date = today(), fs = fitnessScore(date), p = P();
  const wst = metricStatus('weight', date), slim = wst && wst.cur != null ? Math.max(0, Math.min(1, (wst.start - wst.cur) / (wst.start - wst.goal))) : 0;
  const body = METRIC_DEFS.map(m => metricStatus(m.id, date)).filter(Boolean).map(st => metricBar(st, date)).join('');
  const groups = { push: 'Push', pull: 'Pull', legs: 'Legs', other: 'Other' };
  const names = R.tab === 'other' ? [] : allExerciseNames(R.tab);
  const sc = scienceCheck(date);
  const hangs = Object.keys(S.days).filter(d => S.days[d].hang && S.days[d].hang.best).sort().map(d => ({ date: d, v: +S.days[d].hang.best }));
  const other = R.tab !== 'other' ? '' : `<div class="beam"><div class="hd"><span class="n">Dead hangs — best hang</span><span class="g">${hangs.length} logs</span></div>${hangs.length ? beamSvg({ frac: Math.min(1, Math.max(0, (hangs[hangs.length - 1].v - hangs[0].v) / (hangs[0].v * 0.25))), timeFrac: tOf(date) / D(), state: hangs.length > 1 && hangs[hangs.length - 1].v < hangs[0].v * 0.95 ? 'slow' : 'zone', left: hangs[0].v + ' s', right: 'GOAL ' + Math.round(hangs[0].v * 1.25) + ' s' }) + '<div class="st ok">' + hangs[0].v + ' s → ' + hangs[hangs.length - 1].v + ' s best.</div>' : beamSvg({ frac: 0, state: 'nodata', left: '—', right: 'GOAL +25 %' }) + '<div class="st muted">No hangs logged yet.</div>'}</div>
    <div class="card flat"><div class="cond">Muay Thai</div><div class="muted">${Object.keys(S.days).filter(d => S.days[d].mt && S.days[d].mt.minutes).length} sessions · ${Object.keys(S.days).reduce((a, d) => a + (S.days[d].mt && +S.days[d].mt.minutes || 0), 0)} min total</div></div>`;
  return `<div class="screen">${band('Dashboard', esc(p.name))}
    <div class="avatar" data-avatar>${heroSvg({ level: fs.level, slim, size: 120 })}<div><div class="score">${fs.score}</div><div class="lvl">${fs.name}</div><div class="muted small">Fitness score · tap to see what moved it</div></div></div>
    <div class="sec-h">Body</div>${body}
    <div class="sec-h">Training</div>
    <div class="tabs">${Object.keys(groups).map(k => `<button data-tab="${k}" class="${R.tab === k ? 'on' : ''}">${groups[k]}</button>`).join('')}</div>
    ${names.map(n => exerciseBar(n, date)).join('')}${other}
    <div class="sec-h">Science check</div>
    <div class="card"><div class="kv"><span>Days with nutrition logged</span><b>${sc.loggedDays}</b><span>Logged balance so far</span><b>${sc.totalBalance > 0 ? '+' : ''}${Math.round(sc.totalBalance)} kcal</b><span>Loss the calorie log predicts</span><b>${sc.predictedLoss.toFixed(2)} kg</b><span>Scale says lost (7-day avg)</span><b>${sc.lost == null ? '—' : sc.lost.toFixed(2) + ' kg'}</b><span>Real kcal per kg lost</span><b>${sc.kcalPerKg == null ? 'need more data' : sc.kcalPerKg.toLocaleString() + ' (plan: 7,700)'}</b></div>
    <div class="muted small">Well above 7,700 means you're eating more than you log or the band overestimates; well below means water/glycogen or lean mass is going too.</div></div>
    <button class="btn sec" data-csv>Export readings as CSV</button>
  </div>${nav('dash')}`;
}
function bindDash() {
  const date = today();
  app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { R.tab = b.dataset.tab; render(); });
  app.querySelectorAll('[data-metric]').forEach(el => el.onclick = () => metricTooltip(el.dataset.metric, date));
  app.querySelectorAll('[data-ex]').forEach(el => el.onclick = () => exerciseExpand(el.dataset.ex, date));
  $('[data-avatar]').onclick = () => { const fs = fitnessScore(date); modal(`<h3>What moved the needle</h3><div class="muted">Score ${fs.score} · ${fs.name}</div><div class="kv" style="margin-top:10px">${fs.parts.map(p => `<span>${esc(p.label)}<br><span class="muted small">${esc(p.note)} · weight ${Math.round(p.w * 100)} %</span></span><b class="${p.v >= 80 ? 'ok' : p.v >= 50 ? 'warn' : 'bad'}">${p.v}</b>`).join('')}</div><div class="muted small">Levels: 0–39 soft · 40–59 getting there · 60–79 lean · 80–94 shredded · 95+ powered up.</div><button class="btn sec" onclick="this.closest('.modalbg').remove()">Close</button>`); };
  $('[data-csv]').onclick = () => { const rows = [['date', 'weight', 'fat', 'muscle', 'skeletal', 'visceral', 'water', 'kcal', 'protein', 'band', 'balance', 'balls']]; const dates = new Set([...Object.keys(S.readings), ...Object.keys(S.days)]); [...dates].sort().forEach(d => { const r = S.readings[d] || {}, n = (S.days[d] || {}).nutrition || {}, nc = nutritionCalc(d); rows.push([d, r.weight, r.fat, r.muscle, r.skeletal, r.visceral, r.water, n.kcal, n.protein, n.band, nc ? nc.balance : '', tOf(d) >= 0 ? dragonBalls(d).balls : ''].map(x => x == null ? '' : x)); }); download('vikac-readings-' + today() + '.csv', rows.map(r => r.join(',')).join('\n'), 'text/csv'); };
}
function metricTooltip(id, date) {
  const st = metricStatus(id, date), def = st.def, u = def.unit === '%' ? ' %' : def.unit ? ' ' + def.unit : '';
  const f = v => v == null ? '—' : v.toFixed(def.dec) + u;
  const dots = readingsUpTo(date, 7).reverse().map(x => x.r[id]).filter(v => v != null && v !== '');
  const mn = Math.min(...dots), mx = Math.max(...dots), rng = mx - mn || 1;
  modal(`<h3>${def.label}</h3>
    <div class="kv"><span>Plan says today</span><b>${f(st.exp)}</b><span>You are (7-day avg)</span><b class="${st.cls}">${f(st.cur)}</b><span>Difference</span><b>${st.diff == null ? '—' : (st.diff > 0 ? '+' : '') + st.diff.toFixed(def.dec) + u}</b><span>Tolerance band</span><b>±${st.tol}${u}</b><span>Goal on ${fmtShort(P().endDate)}</span><b>${f(st.goal)}</b><span>Projected (14-day trend)</span><b>${st.proj == null ? 'need 14 days' : f(st.proj)}</b>${st.r14 != null ? `<span>Trend</span><b>${(st.r14 * 7 > 0 ? '+' : '') + (st.r14 * 7).toFixed(2)}${u}/week</b>` : ''}</div>
    ${dots.length ? `<div class="muted small">Last ${dots.length} readings</div><div class="dots">${dots.map(v => `<i style="height:${10 + (v - mn) / rng * 18}px" title="${v}"></i>`).join('')}</div>` : ''}
    <div class="${st.cls}" style="font-weight:800;margin-top:6px">${esc(st.text)}</div>
    ${st.action ? `<div style="margin-top:8px">${esc(st.action)}</div>` : ''}
    <button class="btn sec" style="margin-top:12px" onclick="this.closest('.modalbg').remove()">Close</button>`);
}
function exerciseExpand(name, date) {
  const type = exType(name), hist = exerciseHistory(name);
  if (!hist.length) return modal(`<h3>${esc(name)}</h3><div class="muted">No sessions logged yet.</div><button class="btn sec" style="margin-top:12px" onclick="this.closest('.modalbg').remove()">Close</button>`);
  const lastSess = S.sessions.filter(s => s.finished && s.ex.some(e => e.n === name && exScore(e, type).v > 0)).sort((a, b) => a.date < b.date ? 1 : -1)[0];
  const e = lastSess.ex.find(x => x.n === name), v = verdictFor(name, e, lastSess.date, lastSess.id);
  const ctx = v.prev ? ['weight', 'muscle', 'fat'].map(id => { const a = current(id, v.prevDate), b = current(id, lastSess.date), def = METRIC_DEFS.find(m => m.id === id); if (a == null || b == null) return ''; const good = def.dir < 0 ? b <= a : b >= a - 0.3; return `<div class="beam" style="box-shadow:none"><div class="hd"><span class="n">${def.label}</span><span class="g">${fmtShort(v.prevDate)} → ${fmtShort(lastSess.date)}</span></div>${beamSvg({ frac: 1, state: good ? 'zone' : 'slow', left: a.toFixed(1), right: b.toFixed(1) })}</div>`; }).join('') : '';
  const mx = Math.max(...hist.map(h => h.v)), mn = Math.min(...hist.map(h => h.v)), rng = mx - mn || 1;
  modal(`<h3>${esc(name)}</h3><div class="muted small">${hist.map(h => fmtShort(h.date) + ': ' + h.label).join(' · ')}</div>
    <div class="dots">${hist.map(h => `<i style="height:${8 + (h.v - mn) / rng * 20}px"></i>`).join('')}</div>
    <div class="${v.cls}" style="font-weight:800;margin:8px 0">${esc(v.text)}</div>${ctx}
    <div style="margin-top:8px">${esc(contextSentence(name, e, lastSess.date, lastSess.id))}</div>
    <div class="field" style="margin-top:12px"><label>Goal multiplier for this exercise (1.03 = +3 %)</label><input type="number" step="0.01" id="tgt" value="${S.targets[name] || (type === 'max' ? 1.25 : 1.03)}"></div>
    <button class="btn sec" id="saveT">Save goal & close</button>`, bg => { bg.querySelector('#saveT').onclick = () => { const v = num(bg.querySelector('#tgt').value); if (v) S.targets[name] = v; save(); bg.remove(); render(); }; });
}

/* ---------- Profile ---------- */
function download(name, content, type) { const b = new Blob([content], { type: type || 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
function profileHtml() {
  const p = P(), s = p.start;
  const inp = (k, label, v, step, type) => `<div class="field"><label>${label}</label><input name="${k}" type="${type || 'number'}" step="${step || 0.1}" inputmode="decimal" value="${v == null ? '' : v}"></div>`;
  const stand = window.matchMedia('(display-mode: standalone)').matches;
  return `<div class="screen">${band('Profile', esc(p.name))}
    <div class="card"><h3>Backup</h3><div class="muted" style="margin:0 0 10px">${S.meta.lastBackup ? 'Last backup ' + fmtDate(S.meta.lastBackup.slice(0, 10)) : 'No backup yet.'} The file holds everything; drop it in Google Drive.</div>
      <div class="row"><button class="btn" data-backup>Backup now</button><button class="btn sec" data-restore>Restore</button></div><input type="file" accept="application/json,.json" id="restoreFile" style="display:none"></div>
    <div class="card"><h3>Project</h3>
      <div class="field"><label>Name</label><input name="name" value="${esc(p.name)}"></div>
      <div class="row">${inp('startDate', 'Start', p.startDate, 1, 'date')}${inp('endDate', 'End', p.endDate, 1, 'date')}</div>
      <div class="row">${inp('deficit', 'Daily deficit (kcal)', p.deficit, 10)}${inp('bmr', 'BMR', p.bmr, 10)}</div>
      <div class="row">${inp('protein', 'Protein target (g)', p.protein, 5)}${inp('bandDefault', 'Band kcal default', p.bandDefault, 10)}</div>
      ${inp('waterDrop', 'Early water drop (kg)', p.waterDrop)}
      <h3 style="margin:8px 0">Starting readings</h3>
      <div class="row">${inp('weight', 'Weight', s.weight)}${inp('fat', 'Body fat %', s.fat)}</div>
      <div class="row">${inp('muscle', 'Muscle mass', s.muscle)}${inp('skeletal', 'Skeletal muscle', s.skeletal)}</div>
      <div class="row">${inp('visceral', 'Visceral', s.visceral, 1)}${inp('water', 'Water %', s.water)}</div>
      <div class="row">${inp('height', 'Height', p.height, 1)}${inp('age', 'Age', p.age, 0.5)}</div>
      <div class="muted" id="derived"></div><div style="height:8px"></div>
      <button class="btn" data-savep>Save changes</button></div>
    <div class="card"><h3>App</h3><div class="muted" style="margin:0 0 10px">Version ${APP_VERSION} · ${stand ? 'installed, full screen' : 'running in the browser — use Chrome menu → Add to Home screen for full screen'}</div>
      <button class="btn" data-update style="margin-bottom:10px">Check for updates</button>
      <div class="row"><button class="btn sec" data-intro>Replay intro</button><button class="btn ghost" data-reset>Reset everything</button></div></div>
  </div>${nav('profile')}`;
}
function bindProfile() {
  const upd = () => { const o = readForm(app); const Dd = diffDays(o.startDate, o.endDate); $('#derived').innerHTML = Dd > 0 && o.weight ? `${Dd} days → goal <b class="or">${(o.weight - o.deficit * Dd / 7700).toFixed(1)} kg</b>` : ''; };
  app.querySelectorAll('input').forEach(i => i.oninput = upd); upd();
  $('[data-savep]').onclick = () => { const o = readForm(app); if (!o.weight || diffDays(o.startDate, o.endDate) < 7) return toast('Check dates and weight'); Object.assign(S.project, { name: o.name, startDate: o.startDate, endDate: o.endDate, deficit: o.deficit, bmr: o.bmr, protein: o.protein, bandDefault: o.bandDefault, waterDrop: o.waterDrop, height: o.height, age: o.age, start: { weight: o.weight, fat: o.fat, muscle: o.muscle, skeletal: o.skeletal, visceral: o.visceral, water: o.water } }); save(); toast('Saved. Everything recalculated.'); };
  $('[data-backup]').onclick = () => { S.meta.lastBackup = new Date().toISOString(); save(); download('vikac-backup-' + today() + '.json', JSON.stringify(S, null, 1)); toast('Backup downloaded'); };
  $('[data-restore]').onclick = () => $('#restoreFile').click();
  $('#restoreFile').onchange = e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { const o = JSON.parse(rd.result); if (!o.project || !o.days) throw 0; if (confirm('Replace all current data with this backup?')) { S = o; save(); toast('Restored'); render(); } } catch (err) { toast('Not a valid backup file'); } }; rd.readAsText(f); };
  $('[data-intro]').onclick = () => playIntro(() => render());
  $('[data-update]').onclick = async () => { toast('Checking…'); try { const reg = await navigator.serviceWorker.getRegistration(); if (reg) { await reg.update(); if (reg.waiting) reg.waiting.postMessage('skipWaiting'); } const r = await fetch('index.html', { cache: 'no-cache' }); const t = await r.text(); const m = t.match(/APP_VERSION = '([^']+)'/); if (m && m[1] !== APP_VERSION) { toast('Version ' + m[1] + ' found — reloading'); setTimeout(() => location.reload(), 800); } else toast('You have the latest version (' + APP_VERSION + ')'); } catch (e) { toast('Offline — try again later'); } };
  $('[data-reset]').onclick = () => { if (confirm('Delete ALL data? Back up first!') && confirm('Really? This cannot be undone.')) { S = { project: null, days: {}, readings: {}, sessions: [], targets: {}, meta: { schema: 1, lastBackup: null, introSeen: true } }; save(); R.stack = []; render(); } };
}

/* ---------- Intro: slim-down → power-up → high kick, ~3.2 s ---------- */
function playIntro(done) {
  const el = document.createElement('div'); el.className = 'intro';
  el.innerHTML = `<div class="ttl"><div class="title t1">Vikač</div><div class="title t2">High Kikač</div></div><div class="stage"><div id="istage"></div><div class="wt" id="iwt">90 kg</div></div><button class="skip">skip</button>`;
  document.body.appendChild(el); let fin = false, raf = null;
  const stage = el.querySelector('#istage'), wt = el.querySelector('#iwt');
  const bag = (sw) => `<g transform="translate(300 40) rotate(${sw} 0 0)"><line x1="0" y1="-30" x2="0" y2="0" stroke="#1B1B1B" stroke-width="4"/><rect x="-28" y="0" width="56" height="170" rx="18" fill="#2A2A2A" stroke="#1B1B1B" stroke-width="3"/><rect x="-28" y="14" width="56" height="14" fill="#FE7F0C"/><rect x="-28" y="140" width="56" height="14" fill="#FE7F0C"/></g>`;
  const impact = `<g transform="translate(272 130)"><path d="M0 -40 L10 -12 L40 -26 L18 0 L44 18 L14 12 L8 44 L-6 14 L-38 24 L-14 0 L-40 -22 L-12 -10 Z" fill="#FFD400" stroke="#1B1B1B" stroke-width="3" stroke-linejoin="round"/><text x="0" y="8" text-anchor="middle" font-family="Bangers,Impact" font-size="26" fill="#1B1B1B">KIKAČ!</text></g>`;
  const frame = (t) => { // t in seconds
    let slim, level, pose = 'stand', aura = false, mood, extra = '', sw = 0;
    if (t < 1.6) { slim = Math.min(1, t / 1.5); level = slim < .35 ? 0 : slim < .7 ? 1 : 3; mood = slim < .35 ? 'tired' : slim < .7 ? 'happy' : 'cool'; wt.textContent = Math.round(90 - 13 * slim) + ' kg'; }
    else if (t < 2.2) { slim = 1; level = 4; aura = true; mood = 'fire'; }
    else { slim = 1; level = 4; aura = true; mood = 'fire'; pose = 'kick'; sw = t < 2.5 ? 0 : Math.sin((t - 2.5) * 9) * 18 * Math.max(0, 1 - (t - 2.5)); extra = t >= 2.45 ? impact : ''; }
    stage.innerHTML = `<svg viewBox="-20 -40 360 400" style="overflow:visible">${pose === 'kick' ? bag(sw) : bag(0)}<g transform="translate(${pose === 'kick' ? 30 : 40} 0)">${heroSvg({ inner: true, slim, level, pose, aura, mood })}</g>${extra}</svg>`;
  };
  const t0 = performance.now();
  const loop = () => { if (fin) return; const t = (performance.now() - t0) / 1000; frame(t); if (t < 3.4) raf = requestAnimationFrame(loop); };
  const end = () => { if (fin) return; fin = true; cancelAnimationFrame(raf); el.style.transition = 'opacity .4s'; el.style.opacity = 0; setTimeout(() => el.remove(), 400); done && done(); };
  el.querySelector('.skip').onclick = end; frame(0); raf = requestAnimationFrame(loop); setTimeout(end, 3900);
}

/* ---------- Boot ---------- */
(async function boot() {
  await load();
  const start = () => { R.date = today(); render(); };
  if (!S.meta.introSeen) { S.meta.introSeen = true; save(); render(); playIntro(start); } else start();
  document.addEventListener('visibilitychange', () => { if (!document.hidden && R.screen === 'today' && R.date !== today() && R.stack.length === 0) { R.date = today(); render(); } });
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }
})();
</script>
</body>
