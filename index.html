<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Vikač High Kikač</title>
<meta name="theme-color" content="#0B0B0B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:'Bangers';font-style:normal;font-weight:400;font-display:swap;src:url(font/bangers-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Bangers';font-style:normal;font-weight:400;font-display:swap;src:url(font/bangers-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --or:#FE7F0C;--or2:#FFA349;--bk:#0B0B0B;--bk2:#161616;--bk3:#222;--wh:#FFFFFF;--gr:#9A9A9A;--gr2:#555;
  --ok:#2ECC71;--warn:#FFB300;--bad:#FF5252;--beam:#19C3FF;--beam2:#8AF3FF;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bk);color:var(--wh);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.35;overscroll-behavior:none}
body{min-height:100vh;min-height:100dvh}
h1,h2,h3{margin:0;font-weight:700}
.title{font-family:'Bangers',Impact,'Arial Narrow Bold',sans-serif;letter-spacing:.04em;line-height:.9;color:var(--or);text-shadow:3px 3px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;-webkit-text-stroke:1px #000;transform:rotate(-3deg)}
.title.sm{font-size:30px;transform:none;text-shadow:2px 2px 0 #000}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--wh);background:var(--bk3);border:1px solid #333;border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--or)}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
label{display:block;font-size:13px;color:var(--gr);margin:0 0 4px}
.field{margin-bottom:12px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.screen{padding:calc(12px + var(--sat)) 16px calc(84px + var(--sab));max-width:560px;margin:0 auto;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:40px}
.back{width:40px;height:40px;border-radius:12px;background:var(--bk2);display:flex;align-items:center;justify-content:center;font-size:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--or);color:#000;font-weight:800;border-radius:14px;padding:14px 18px;min-height:48px;width:100%;letter-spacing:.02em}
.btn.sec{background:var(--bk3);color:var(--wh);font-weight:600}
.btn.ghost{background:none;color:var(--or);border:1px solid var(--or)}
.btn.sm{width:auto;min-height:40px;padding:8px 14px;border-radius:10px;font-size:14px}
.btn:active{transform:scale(.98)}
.card{background:var(--bk2);border-radius:16px;padding:14px;margin-bottom:12px}
.muted{color:var(--gr);font-size:13px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.or{color:var(--or)}
.small{font-size:13px}.big{font-size:22px;font-weight:800}
.center{text-align:center}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:rgba(11,11,11,.96);border-top:1px solid #222;padding:8px 0 calc(8px + var(--sab));backdrop-filter:blur(8px);z-index:20}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--gr);padding:4px 0}
.nav button.on{color:var(--or)}
.nav svg{width:24px;height:24px}
/* header on Today */
.dayhead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px}
.dayhead .date{font-size:13px;color:var(--gr)}
.dayhead .dayno{font-family:'Bangers',Impact,sans-serif;font-size:34px;color:var(--or);line-height:1;letter-spacing:.03em}
.funline{font-size:14px;color:var(--wh);margin-bottom:14px}
.pill{display:inline-block;background:var(--bk3);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--gr)}
/* checklist */
.todo{list-style:none;margin:0;padding:0}
.todo li{position:relative;display:flex;align-items:center;gap:12px;background:var(--bk2);border-radius:14px;padding:12px 12px 12px 10px;margin-bottom:10px;min-height:60px;overflow:hidden}
.todo .chk{width:30px;height:30px;border-radius:9px;border:2px solid var(--or);flex:none;display:flex;align-items:center;justify-content:center;transition:background .2s}
.todo .chk svg{width:18px;height:18px;opacity:0;transform:scale(.4);transition:all .2s}
.todo li.done .chk{background:var(--or)}
.todo li.done .chk svg{opacity:1;transform:none}
.todo .lab{flex:1;min-width:0}
.todo .lab .t{font-weight:700;position:relative;display:inline-block;transition:opacity .25s}
.todo .lab .t::after{content:"";position:absolute;left:0;right:0;top:55%;height:3px;background:var(--beam);border-radius:2px;transform:scaleX(0);transform-origin:left;transition:transform .35s ease-out .25s;box-shadow:0 0 8px var(--beam)}
.todo li.done .lab .t{opacity:.5}
.todo li.done .lab .t::after{transform:scaleX(1)}
.todo .lab .s{font-size:12px;color:var(--gr)}
.todo .go{color:var(--gr);font-size:20px;padding:0 4px}
.zap{position:absolute;left:46px;top:50%;height:36px;width:60px;transform:translate(-20px,-50%);pointer-events:none;opacity:0}
.zap.play{animation:zap .7s ease-out forwards}
@keyframes zap{0%{opacity:0;transform:translate(-20px,-50%) scale(.6)}15%{opacity:1;transform:translate(0,-50%) scale(1)}70%{opacity:1;transform:translate(6px,-50%) scale(1)}100%{opacity:0;transform:translate(10px,-50%) scale(1)}}
/* dragon balls */
.balls{display:flex;justify-content:center;gap:8px;margin:14px 0 4px}
.ball{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3 0,#fff0 40%),radial-gradient(circle at 50% 50%,#FFB347,#FE7F0C 60%,#B24E00);box-shadow:0 0 10px #fe7f0c88,inset 0 -3px 6px #0005;position:relative;transition:all .3s}
.ball.off{filter:grayscale(1) brightness(.35);box-shadow:none}
.ball::after{content:"";position:absolute;left:11px;top:9px;width:9px;height:9px;background:#fff;border-radius:50%;opacity:.35}
.ball.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
/* beam bar */
.beam{background:var(--bk2);border-radius:16px;padding:10px 12px 8px;margin-bottom:10px}
.beam .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.beam .hd .n{font-weight:700}
.beam .hd .g{font-size:12px;color:var(--gr)}
.beam svg{width:100%;height:auto;display:block}
.beam .st{font-size:13px;margin-top:2px;font-weight:600}
.tabs{display:flex;gap:6px;margin:8px 0 12px}
.tabs button{flex:1;background:var(--bk3);border-radius:10px;padding:9px 0;font-size:14px;font-weight:700;color:var(--gr)}
.tabs button.on{background:var(--or);color:#000}
/* modal */
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;animation:fade .15s}
.modal{background:var(--bk2);border:1px solid #2a2a2a;border-radius:18px;padding:18px;width:100%;max-width:440px;max-height:85vh;overflow:auto}
.modal h3{margin-bottom:8px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;margin:8px 0}
.kv b{font-weight:700}
.dots{display:flex;gap:4px;align-items:flex-end;height:28px;margin:6px 0}
.dots i{flex:1;background:var(--beam);border-radius:2px 2px 0 0;opacity:.8;min-height:3px}
/* workout */
.ex{background:var(--bk2);border-radius:14px;padding:12px;margin-bottom:10px}
.ex .nm{font-weight:800}
.ex .sch{font-size:12px;color:var(--or)}
.ex .last{font-size:12px;color:var(--gr);margin:4px 0 8px;background:#000;border-radius:8px;padding:6px 8px}
.sets{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:center}
.sets span{font-size:12px;color:var(--gr);width:26px}
.sets input{padding:8px 10px;text-align:center}
.ex textarea{margin-top:8px;min-height:40px;resize:vertical}
.ex .verdict{font-size:13px;margin-top:8px;font-weight:600}
/* stretch */
.step{background:var(--bk2);border-radius:14px;padding:12px;margin-bottom:10px}
.step img{width:100%;border-radius:10px;display:block;margin-top:8px}
.step .tm{display:flex;align-items:center;gap:10px;margin-top:8px}
.step .tm .t{font-family:'Bangers',Impact,sans-serif;font-size:28px;color:var(--or);min-width:70px;letter-spacing:.04em}
/* avatar */
.avatar{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.avatar svg{width:120px;height:150px;flex:none}
.score{font-family:'Bangers',Impact,sans-serif;font-size:44px;color:var(--or);line-height:1;letter-spacing:.03em}
/* intro */
.intro{position:fixed;inset:0;background:radial-gradient(circle at 50% 70%,#1b0e00 0,#0b0b0b 65%);display:flex;flex-direction:column;align-items:center;z-index:100;padding-top:calc(40px + var(--sat))}
.intro .ttl{display:flex;flex-direction:column;align-items:center;gap:4px}
.intro .t1{font-size:76px}
.intro .t2{font-size:52px;transform:rotate(-3deg) translateY(-6px)}
.intro .t1,.intro .t2{animation:slam .5s cubic-bezier(.2,1.4,.4,1) both}
.intro .t2{animation-delay:.25s}
@keyframes slam{from{opacity:0;transform:scale(2.4) rotate(-8deg)}to{opacity:1;transform:scale(1) rotate(-3deg)}}
.intro .stage{flex:1;width:100%;max-width:520px;display:flex;align-items:center;justify-content:center}
.intro .stage svg{width:100%;height:auto;max-height:62vh}
.intro .skip{position:absolute;bottom:calc(24px + var(--sab));color:var(--gr);font-size:13px;padding:10px 20px}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translateX(-50%);background:var(--or);color:#000;font-weight:700;padding:10px 16px;border-radius:999px;z-index:60;animation:fade .2s;max-width:90vw;text-align:center}
.dragon{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;animation:fade .3s}
.dragon svg{width:min(90vw,420px);height:auto}
.dragon .msg{font-family:'Bangers',Impact,sans-serif;font-size:34px;color:var(--or);letter-spacing:.04em;margin-top:10px}
hr{border:0;border-top:1px solid #222;margin:14px 0}
.warnbox{background:#2a1d00;border:1px solid #5a3d00;border-radius:12px;padding:10px 12px;font-size:13px;color:#ffd27a;margin-bottom:12px}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ Vikač High Kikač — core (data + math) ============ */
'use strict';
const APP_VERSION = '1.0.0';

/* ---------- Program ---------- */
// type: main (kg×reps sets), hn (heavy + normal sets), max (5-min MAX: reps + load), ctrl (heavy/controlled)
const EX = (n, s, sets, type) => ({ n, s, sets, type: type || 'main' });
const PROGRAM = {
  cycle: [
    { d: 1, w: 'push' }, { d: 2, w: 'mt' }, { d: 3, w: 'rest' }, { d: 4, w: 'legs' },
    { d: 5, w: 'rest', noHang: true, noStretch: true }, { d: 6, w: 'mt' }, { d: 7, w: 'pull' }, { d: 8, w: 'rest' },
  ],
  mobilityDays: [2, 4, 6],
  workouts: {
    pushA: { name: 'Push A', group: 'push', ex: [
      EX('DB bench press', '3 × 5 @ 85% 1RM', 3),
      EX('DB overhead press', '3 × 4–6 @ 2 RIR', 3),
      EX('Close grip DB press', '3 × 4–6 @ 2 RIR', 3),
      EX('Cable crossovers', '1 × 3–5 heavy, 2 × 6–10', 3, 'hn'),
      EX('DB overhead extensions', '1 × 3–5 heavy, 2 × 6–10', 3, 'hn'),
      EX('DB side lateral raises', '1 × 3–5 heavy, 2 × 6–10', 3, 'hn'),
      EX('Weighted pushups', '5 min MAX', 1, 'max'),
    ]},
    pushB: { name: 'Push B', group: 'push', ex: [
      EX('DB bench press', '3 × 5 @ 85% 1RM', 3),
      EX('Incline DB bench press', '3 × 4–6 @ 2 RIR', 3),
      EX('DB overhead press', '3 × 4–6 @ 2 RIR', 3),
      EX('Triceps pushdown', '1 × 3–5 heavy, 2 × 6–10', 3, 'hn'),
      EX('DB hip huggers', '1 × 3–5 heavy, 2 × 6–10', 3, 'hn'),
      EX('Low to high crossovers', '1 × 3–5 heavy, 2 × 6–10', 3, 'hn'),
      EX('Pushups', '5 min MAX', 1, 'max'),
    ]},
    legsA: { name: 'Legs A', group: 'legs', ex: [
      EX('BB squats', '3 × 5 @ 85% 1RM', 3),
      EX('Alternating reverse DB lunges', '3 × 4–6 / side @ 2 RIR', 3),
      EX('Leg curl', '1 × 8 heavy, 2 × 12 controlled', 3, 'hn'),
      EX('Leg extension', '3 × 8 heavy, 1 × 12 controlled', 4, 'hn'),
      EX('DB alternating step ups', '1 × 3–5 heavy, 2 × 6–10', 3, 'hn'),
      EX('DB stiff leg deadlift', '1 × 3–5 heavy, 2 × 6–10', 3, 'hn'),
      EX('DB standing calf raises', '1 × 3–5 heavy, 2 × 6–10', 3, 'hn'),
      EX('DB goblet squats', '5 min MAX', 1, 'max'),
    ]},
    legsB: { name: 'Legs B', group: 'legs', ex: [
      EX('BB squats', '3 × 5 @ 85% 1RM', 3),
      EX('BB RDL', '3 × 4–6 @ 2 RIR', 3),
      EX('Bag swings', '3 × 4–6 @ 2 RIR', 3),
      EX('Alternating reverse DB lunges', '1 × 3–5 heavy, 2 × 6–10', 3, 'hn'),
      EX('DB jump squats', '1 × 3–5 heavy, 2 × 6–10', 3, 'hn'),
      EX('DB seated calf raises', '1 × 3–5 heavy, 2 × 6–10', 3, 'hn'),
      EX('Creeping lunges', '5 min MAX', 1, 'max'),
    ]},
    pullA: { name: 'Pull A', group: 'pull', ex: [
      EX('Deadlift', '3 × 5 @ 85% 1RM', 3),
      EX('Barbell shrugs', '3 × 4–6 @ 2 RIR', 3),
      EX('Weighted chins', '3 × 4–6 @ 2 RIR', 3),
      EX('Lat pulldowns', '1 × 3–5 heavy, 2 × 6–10 controlled', 3, 'hn'),
      EX('Face pulls', '1 × 3–5 heavy, 3 × 6–10 controlled', 4, 'hn'),
      EX('Standing DB curls', '1 × 3–5 heavy, 2 × 6–10 controlled', 3, 'hn'),
      EX('Pullups', '5 min MAX', 1, 'max'),
    ]},
    pullB: { name: 'Pull B', group: 'pull', ex: [
      EX('Deadlift', '3 × 5 @ 85% 1RM', 3),
      EX('Barbell curls', '3 × 4–6 @ 2 RIR', 3),
      EX('Weighted pullups', '3 × 4–6 @ 2 RIR', 3),
      EX('Seated cable rows', '1 × 3–5 heavy, 2 × 6–10 controlled', 3, 'hn'),
      EX('Straight arm pushdowns', '1 × 3–5 heavy, 2 × 6–10 controlled', 3, 'hn'),
      EX('Cross body hammer curls', '1 × 3–5 heavy, 2 × 6–10 controlled', 3, 'hn'),
      EX('Face pulls', '5 min MAX', 1, 'max'),
    ]},
  },
};
const STRETCH = [
  { t: 'Sjedenje na koljenima', d: 30 },
  { t: 'Sjedenje na koljenima, ali se podignuti', d: 30 },
  { t: '2 × 15 podizanje na koljena', d: 30 },
  { t: 'Izvući nogu i podignutu nogu gurati prema van', d: 45, sides: 2, img: 'img/stretch4.jpg' },
  { t: 'Asian squat', d: 90 },
  { t: 'Rotirati unutarnju ruku kao na slici', d: 45, sides: 2, img: 'img/stretch6.jpg' },
  { t: "World's greatest stretch — stopalo rotirati na vanjsku stranu", d: 45, sides: 2, img: 'img/stretch7a.jpg' },
  { t: "World's greatest stretch — stopalo rotirati jače prema van", d: 45, sides: 2, img: 'img/stretch7b.jpg' },
  { t: 'Prva slika', d: 30, sides: 2, img: 'img/stretch8a.jpg' },
  { t: 'Druga slika', d: 30, sides: 2, img: 'img/stretch8b.jpg' },
  { t: 'Treća slika', d: 30, sides: 2, img: 'img/stretch8c.jpg' },
];

/* ---------- State + persistence ---------- */
const DEFAULT_PROJECT = {
  name: 'Vikač High Kikač', startDate: '2026-11-03', endDate: '2026-12-31',
  deficit: 500, bmr: 1750, protein: 180, waterDrop: 0.5, bandDefault: 300,
  height: 183, age: 31.5,
  start: { weight: 83.3, fat: 22.7, muscle: 60.9, skeletal: 33.5, visceral: 10, water: 55 },
};
let S = { project: null, days: {}, readings: {}, sessions: [], targets: {}, meta: { schema: 1, lastBackup: null, introSeen: false, createdAt: null } };
const LS_KEY = 'vikac.state.v1';
let idb = null;
function idbOpen() {
  return new Promise(res => {
    try {
      const r = indexedDB.open('vikac', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
    } catch (e) { res(null); }
  });
}
function idbGet() {
  return new Promise(res => {
    if (!idb) return res(null);
    try { const tx = idb.transaction('kv'); const q = tx.objectStore('kv').get('state'); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); } catch (e) { res(null); }
  });
}
function idbPut(v) { try { if (idb) idb.transaction('kv', 'readwrite').objectStore('kv').put(v, 'state'); } catch (e) {} }
let saveTimer = null;
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
  clearTimeout(saveTimer); saveTimer = setTimeout(() => idbPut(JSON.stringify(S)), 150);
}
async function load() {
  idb = await idbOpen();
  let raw = null;
  try { raw = localStorage.getItem(LS_KEY); } catch (e) {}
  if (!raw) raw = await idbGet();
  if (raw) { try { const o = JSON.parse(raw); S = Object.assign(S, o); } catch (e) {} }
  if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch (e) {} }
}

/* ---------- Dates ---------- */
const pad = n => (n < 10 ? '0' : '') + n;
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parse(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function today() { return ymd(new Date()); }
function addDays(s, n) { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); }
function diffDays(a, b) { return Math.round((parse(b) - parse(a)) / 864e5); }
const WD = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function fmtDate(s) { const d = parse(s); return WD[d.getDay()] + ', ' + d.getDate() + ' ' + MO[d.getMonth()] + ' ' + d.getFullYear(); }
function fmtShort(s) { const d = parse(s); return d.getDate() + ' ' + MO[d.getMonth()]; }

/* ---------- Project helpers ---------- */
const P = () => S.project;
function D() { return diffDays(P().startDate, P().endDate); }           // days of deficit (58)
function tOf(date) { return diffDays(P().startDate, date); }            // 0 on Day 1
function goalWeight() { const p = P(); return Math.round((p.start.weight - p.deficit * D() / 7700) * 10) / 10; }
function rate() { return (P().start.weight - goalWeight()) / D(); }     // kg/day

function dayInfo(date) {
  const t = tOf(date), idx = t + 1, Dd = D();
  if (t < 0) return { t, idx, phase: 'pre' };
  if (t > Dd) return { t, idx, phase: 'post' };
  const cd = ((t % 8) + 8) % 8, cyc = PROGRAM.cycle[cd], cycleNum = Math.floor(t / 8) + 1;
  const variant = cycleNum % 2 === 1 ? 'A' : 'B';
  const workoutKey = cyc.w === 'rest' || cyc.w === 'mt' ? null : cyc.w + variant;
  const items = [{ id: 'weigh', label: 'Morning weigh-in', sub: 'Log the scale' }];
  if (cyc.w === 'mt') items.push({ id: 'mt', label: 'Muay Thai', sub: 'Bag work / class — log minutes' });
  if (workoutKey) items.push({ id: 'workout', key: workoutKey, label: PROGRAM.workouts[workoutKey].name, sub: PROGRAM.workouts[workoutKey].ex.length + ' exercises' });

/* ---------- Dashboard ---------- */
function metricBar(st, date) {

  const span = st.start - st.goal; let frac = 0, ef = null;
  if (def.dir < 0) { frac = st.cur == null ? 0 : (st.start - st.cur) / span; ef = (st.start - st.exp) / span; }
  else { frac = st.cur == null ? 0 : tf; ef = tf; }
  const u = def.unit === '%' ? ' %' : def.unit ? ' ' + def.unit : '';
  return `<div class="beam" data-metric="${def.id}"><div class="hd"><span class="n">${def.label}</span><span class="g">${st.cur != null ? 'now ' + st.cur.toFixed(def.dec) + u : 'no data'}</span></div>
    ${beamSvg({ frac, expFrac: ef, timeFrac: tf, state: st.state === 'ahead' ? 'zone' : st.state, left: st.start.toFixed(def.dec) + u, right: 'goal ' + st.goal.toFixed(def.dec) + u })}
    <div class="st ${st.cls}">${esc(st.text)}</div></div>`;

  app.querySelectorAll('[data-metric]').forEach(el => el.onclick = () => metricTooltip(el.dataset.metric, date));
  app.querySelectorAll('[data-ex]').forEach(el => el.onclick = () => exerciseExpand(el.dataset.ex, date));
  $('[data-avatar]').onclick = () => { const fs = fitnessScore(date); modal(`<h3>What moved the needle</h3><div class="muted">Score ${fs.score} · ${fs.name}</div><div class="kv" style="margin-top:10px">${fs.parts.map(p => `<span>${esc(p.label)}<br><span class="muted small">${esc(p.note)} · weight ${Math.round(p.w * 100)} %</span></span><b class="${p.v >= 80 ? 'ok' : p.v >= 50 ? 'warn' : 'bad'}">${p.v}</b>`).join('')}</div><div class="muted small">Levels: 0–39 soft · 40–59 getting there · 60–79 lean · 80–94 shredded · 95+ powered up.</div><button class="btn sec" onclick="this.closest('.modalbg').remove()">Close</button>`); };
  $('[data-csv]').onclick = () => { const rows = [['date', 'weight', 'fat', 'muscle', 'skeletal', 'visceral', 'water', 'kcal', 'protein', 'band', 'balance', 'balls']]; const dates = new Set([...Object.keys(S.readings), ...Object.keys(S.days)]); [...dates].sort().forEach(d => { const r = S.readings[d] || {}, n = (S.days[d] || {}).nutrition || {}, nc = nutritionCalc(d); rows.push([d, r.weight, r.fat, r.muscle, r.skeletal, r.visceral, r.water, n.kcal, n.protein, n.band, nc ? nc.balance : '', tOf(d) >= 0 ? dragonBalls(d).balls : ''].map(x => x == null ? '' : x)); }); download('vikac-readings-' + today() + '.csv', rows.map(r => r.join(',')).join('\n'), 'text/csv'); };
}
function metricTooltip(id, date) {
  const st = metricStatus(id, date), def = st.def, u = def.unit === '%' ? ' %' : def.unit ? ' ' + def.unit : '';
  const f = v => v == null ? '—' : v.toFixed(def.dec) + u;
  const dots = readingsUpTo(date, 7).reverse().map(x => x.r[id]).filter(v => v != null && v !== '');
  const mn = Math.min(...dots), mx = Math.max(...dots), rng = mx - mn || 1;
  modal(`<h3>${def.label}</h3>
    <div class="kv"><span>Plan says today</span><b>${f(st.exp)}</b><span>You are (7-day avg)</span><b class="${st.cls}">${f(st.cur)}</b><span>Difference</span><b>${st.diff == null ? '—' : (st.diff > 0 ? '+' : '') + st.diff.toFixed(def.dec) + u}</b><span>Tolerance band</span><b>±${st.tol}${u}</b><span>Goal on ${fmtShort(P().endDate)}</span><b>${f(st.goal)}</b><span>Projected (14-day trend)</span><b>${st.proj == null ? 'need 14 days' : f(st.proj)}</b>${st.r14 != null ? `<span>Trend</span><b>${(st.r14 * 7 > 0 ? '+' : '') + (st.r14 * 7).toFixed(2)}${u}/week</b>` : ''}</div>
    ${dots.length ? `<div class="muted small">Last ${dots.length} readings</div><div class="dots">${dots.map(v => `<i style="height:${10 + (v - mn) / rng * 18}px" title="${v}"></i>`).join('')}</div>` : ''}
    <div class="${st.cls}" style="font-weight:700;margin-top:6px">${esc(st.text)}</div>
    ${st.action ? `<div style="margin-top:8px">${esc(st.action)}</div>` : ''}
    <button class="btn sec" style="margin-top:12px" onclick="this.closest('.modalbg').remove()">Close</button>`);
}
function exerciseExpand(name, date) {
  const type = exType(name), hist = exerciseHistory(name);
  if (!hist.length) return modal(`<h3>${esc(name)}</h3><div class="muted">No sessions logged yet.</div><button class="btn sec" style="margin-top:12px" onclick="this.closest('.modalbg').remove()">Close</button>`);
  const lastSess = S.sessions.filter(s => s.finished && s.ex.some(e => e.n === name && exScore(e, type).v > 0)).sort((a, b) => a.date < b.date ? 1 : -1)[0];
  const e = lastSess.ex.find(x => x.n === name), v = verdictFor(name, e, lastSess.date, lastSess.id);
  const ctx = v.prev ? ['weight', 'muscle', 'fat'].map(id => { const a = current(id, v.prevDate), b = current(id, lastSess.date), def = METRIC_DEFS.find(m => m.id === id); if (a == null || b == null) return ''; const good = def.dir < 0 ? b <= a : b >= a - 0.3; return `<div class="beam"><div class="hd"><span class="n">${def.label}</span><span class="g">${fmtShort(v.prevDate)} → ${fmtShort(lastSess.date)}</span></div>${beamSvg({ frac: 1, state: good ? 'zone' : 'slow', left: a.toFixed(1), right: b.toFixed(1) })}</div>`; }).join('') : '';
  const mx = Math.max(...hist.map(h => h.v)), mn = Math.min(...hist.map(h => h.v)), rng = mx - mn || 1;
  modal(`<h3>${esc(name)}</h3><div class="muted small">${hist.map(h => fmtShort(h.date) + ': ' + h.label).join(' · ')}</div>
    <div class="dots">${hist.map(h => `<i style="height:${8 + (h.v - mn) / rng * 20}px"></i>`).join('')}</div>
    <div class="${v.cls}" style="font-weight:700;margin:8px 0">${esc(v.text)}</div>${ctx}
    <div style="margin-top:8px">${esc(contextSentence(name, e, lastSess.date, lastSess.id))}</div>
    <div class="field" style="margin-top:12px"><label>Goal multiplier for this exercise (1.03 = +3 %)</label><input type="number" step="0.01" id="tgt" value="${S.targets[name] || (type === 'max' ? 1.25 : 1.03)}"></div>
    <button class="btn sec" id="saveT">Save goal & close</button>`, bg => { bg.querySelector('#saveT').onclick = () => { const v = num(bg.querySelector('#tgt').value); if (v) S.targets[name] = v; save(); bg.remove(); render(); }; });
}

/* ---------- Profile ---------- */
function download(name, content, type) { const b = new Blob([content], { type: type || 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
function profileHtml() {
  const p = P(), s = p.start;
  const inp = (k, label, v, step, type) => `<div class="field"><label>${label}</label><input name="${k}" type="${type || 'number'}" step="${step || 0.1}" inputmode="decimal" value="${v == null ? '' : v}"></div>`;
  const stand = window.matchMedia('(display-mode: standalone)').matches;
  return `<div class="screen"><div class="title sm" style="margin-bottom:10px">Profile</div>
    <div class="card"><h3>Backup</h3><div class="muted" style="margin:6px 0 10px">${S.meta.lastBackup ? 'Last backup ' + fmtDate(S.meta.lastBackup.slice(0, 10)) : 'No backup yet.'} The file holds everything; drop it in Google Drive.</div>
      <div class="row"><button class="btn" data-backup>Backup now</button><button class="btn sec" data-restore>Restore</button></div><input type="file" accept="application/json,.json" id="restoreFile" style="display:none"></div>
    <div class="card"><h3>Project</h3>
      <div class="field"><label>Name</label><input name="name" value="${esc(p.name)}"></div>
      <div class="row">${inp('startDate', 'Start', p.startDate, 1, 'date')}${inp('endDate', 'End', p.endDate, 1, 'date')}</div>
      <div class="row">${inp('deficit', 'Daily deficit (kcal)', p.deficit, 10)}${inp('bmr', 'BMR', p.bmr, 10)}</div>
      <div class="row">${inp('protein', 'Protein target (g)', p.protein, 5)}${inp('bandDefault', 'Band kcal default', p.bandDefault, 10)}</div>
      ${inp('waterDrop', 'Early water drop (kg)', p.waterDrop)}
      <h3 style="margin:8px 0">Starting readings</h3>
      <div class="row">${inp('weight', 'Weight', s.weight)}${inp('fat', 'Body fat %', s.fat)}</div>
      <div class="row">${inp('muscle', 'Muscle mass', s.muscle)}${inp('skeletal', 'Skeletal muscle', s.skeletal)}</div>
      <div class="row">${inp('visceral', 'Visceral', s.visceral, 1)}${inp('water', 'Water %', s.water)}</div>
      <div class="row">${inp('height', 'Height', p.height, 1)}${inp('age', 'Age', p.age, 0.5)}</div>
      <div class="muted" id="derived"></div><div style="height:8px"></div>
      <button class="btn" data-savep>Save changes</button></div>
    <div class="card"><h3>App</h3><div class="muted" style="margin:6px 0 10px">Version ${APP_VERSION} · ${stand ? 'installed, full screen' : 'running in the browser — use Chrome menu → Add to Home screen for full screen'}</div>
      <div class="row"><button class="btn sec" data-intro>Replay intro</button><button class="btn ghost" data-reset>Reset everything</button></div></div>
  </div>${nav('profile')}`;
}
function bindProfile() {
  const upd = () => { const o = readForm(app); const Dd = diffDays(o.startDate, o.endDate); $('#derived').innerHTML = Dd > 0 && o.weight ? `${Dd} days → goal <b class="or">${(o.weight - o.deficit * Dd / 7700).toFixed(1)} kg</b>` : ''; };
  app.querySelectorAll('input').forEach(i => i.oninput = upd); upd();
  $('[data-savep]').onclick = () => { const o = readForm(app); if (!o.weight || diffDays(o.startDate, o.endDate) < 7) return toast('Check dates and weight'); Object.assign(S.project, { name: o.name, startDate: o.startDate, endDate: o.endDate, deficit: o.deficit, bmr: o.bmr, protein: o.protein, bandDefault: o.bandDefault, waterDrop: o.waterDrop, height: o.height, age: o.age, start: { weight: o.weight, fat: o.fat, muscle: o.muscle, skeletal: o.skeletal, visceral: o.visceral, water: o.water } }); save(); toast('Saved. Everything recalculated.'); };
  $('[data-backup]').onclick = () => { S.meta.lastBackup = new Date().toISOString(); save(); download('vikac-backup-' + today() + '.json', JSON.stringify(S, null, 1)); toast('Backup downloaded'); };
  $('[data-restore]').onclick = () => $('#restoreFile').click();
  $('#restoreFile').onchange = e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { const o = JSON.parse(rd.result); if (!o.project || !o.days) throw 0; if (confirm('Replace all current data with this backup?')) { S = o; save(); toast('Restored'); render(); } } catch (err) { toast('Not a valid backup file'); } }; rd.readAsText(f); };
  $('[data-intro]').onclick = () => playIntro(() => render());
  $('[data-reset]').onclick = () => { if (confirm('Delete ALL data? Back up first!') && confirm('Really? This cannot be undone.')) { S = { project: null, days: {}, readings: {}, sessions: [], targets: {}, meta: { schema: 1, lastBackup: null, introSeen: true } }; save(); R.stack = []; render(); } };
}

/* ---------- Intro ---------- */
function playIntro(done) {
  const el = document.createElement('div'); el.className = 'intro';
  el.innerHTML = `<div class="ttl"><div class="title t1">Vikač</div><div class="title t2">High Kikač</div></div><div class="stage">${introSvg()}</div><button class="skip">skip</button>`;
  document.body.appendChild(el); let fin = false;
  const end = () => { if (fin) return; fin = true; el.style.transition = 'opacity .4s'; el.style.opacity = 0; setTimeout(() => el.remove(), 400); done && done(); };
  el.querySelector('.skip').onclick = end; setTimeout(end, 3600);
}

/* ---------- Boot ---------- */
(async function boot() {
  await load();
  const start = () => { R.date = today(); render(); };
  if (!S.meta.introSeen) { S.meta.introSeen = true; save(); render(); playIntro(start); } else start();
  document.addEventListener('visibilitychange', () => { if (!document.hidden && R.screen === 'today' && R.date !== today() && R.stack.length === 0) { R.date = today(); render(); } });
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }
})();
</script>
</body>
</html>
