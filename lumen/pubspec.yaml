name: lumen
description: "Lumen - a showcase of UI craft in Flutter."
publish_to: 'none'
version: 0.42.0+109

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  shaders:
    - shaders/glass.frag
    - shaders/aurora.frag
    - shaders/ripple.frag
    - shaders/pblur.frag
    - shaders/disco.frag
    - shaders/holo.frag
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/Bricolage.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
